    '<div class="field full"><label for="mv-contact">Contato *</label><div class="row"><select id="mv-contact" style="flex:1;min-width:0"></select><button type="button" class="btn sm blue" data-v="cnew">+ Novo contato</button></div></div>'+

    '<div class="field mv-rent"><label for="mv-until">Devolução prevista</label><input type="date" id="mv-until"><span class="hint">Em branco = sem prazo; continua fora até você dar baixa</span></div>'+
    '<div class="field mv-sale"><label for="mv-date">Data da venda</label><input type="date" id="mv-date"></div>'+
    '<div class="field"><label for="mv-unit" id="mv-unit-l">Valor por unidade (R$)</label><input type="number" id="mv-unit" min="0" step="0.01" inputmode="decimal"></div>'+
    '<div class="field full"><label for="mv-note">Observação</label><input type="text" id="mv-note" autocomplete="off" placeholder="Ex.: caução, forma de pagamento, evento…"></div></div>'+
   '<div id="mv-total" class="dim" style="margin-top:8px;font-size:13px"></div></div>'+
   '<div class="sect"><div class="h3" style="margin-top:0">Equipamentos selecionados</div><div id="mv-sel"></div></div>'+
   '<div class="sect"><div class="h3" style="margin-top:0">Escolher equipamento</div><div class="toolbar"><div class="grow1"><input type="search" id="mv-q" placeholder="Buscar por nome, modelo ou série…" aria-label="Buscar equipamento"></div><select id="mv-tag" style="width:auto" aria-label="Categoria"><option value="all">Todas as categorias</option>'+tags.map(t=>'<option value="'+esc(t.name)+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="pick" id="mv-pick"></div></div>';
  m.foot.innerHTML='<button class="btn" data-mclose>Cancelar</button><button class="btn pri" data-v="save"></button>';
  const isRent=()=>st.kind==='alugado';
  const win=()=>{ const a=st.from||todayISO(); return [a,st.until&&st.until>=a?st.until:a]; };
  /* quantas unidades do item podem sair agora */
  const free=it=>{
    if(isRent()){ const [a,b]=win(); return itemAvail(it,a,b).free; }
    return Math.max(0,totalQty(it)-rentedOn(it,todayISO()));
  };
  const why=it=>{
    if(isRent()) return itemAvail(it,...win()).reason;
    return rentedOn(it,todayISO())?'alugado no momento':'';
  };
  const fillContacts=()=>{
    const opts2=S.contacts.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt'));
    if(st.contactId&&!S.contactsById.has(st.contactId)&&st.tmpC.has(st.contactId)) opts2.push(Object.assign({id:st.contactId},st.tmpC.get(st.contactId)));
    $('#mv-contact',m.el).innerHTML='<option value="">— escolher contato —</option>'+opts2.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name+(c.company?' — '+c.company:''))+'</option>').join('');
    $('#mv-contact',m.el).value=st.contactId;
  };
  const renderKind=()=>{
    m.setTitle(isRent()?'Alugar equipamento':'Vender equipamento');
    $$('[data-v="kind"]',m.el).forEach(b=>b.classList.toggle('on',b.dataset.kind===st.kind));
    $$('.mv-rent',m.el).forEach(x=>x.classList.toggle('hide',!isRent())); $$('.mv-sale',m.el).forEach(x=>x.classList.toggle('hide',isRent()));
    $('#mv-unit-l',m.el).textContent=isRent()?'Valor do aluguel por unidade (R$)':'Valor da venda por unidade (R$)';
    $('[data-v="save"]',m.el).textContent=isRent()?'Registrar aluguel':'Registrar venda';
    renderAll();
  };
  const renderTotal=()=>{
    const units=Array.from(st.sel.values()).reduce((s,q)=>s+q,0), u=num(st.unit);
    $('#mv-total',m.el).textContent=units?units+' unidade(s)'+(u?' × '+money(u)+' = '+money(u*units):''):'';
  };
  const renderSelInner=()=>{
    const box=$('#mv-sel',m.el);
    if(!st.sel.size){ box.innerHTML='<div class="empty">Nenhum equipamento escolhido.<br>Use a lista abaixo.</div>'; renderTotal(); return; }
    box.innerHTML=Array.from(st.sel,([id,q])=>{
      const it=S.itemsById.get(id); if(!it) return '';
      const f=free(it), bad=q>f;
      return '<div class="arow'+(bad?' bad':'')+'"><div style="min-width:0"><b>'+esc(it.name)+'</b><br><small class="dim">'+esc([it.model&&it.model!==it.name?it.model:'',it.serial?'S/N '+it.serial:''].filter(Boolean).join(' · ')||groupKey(it))+'</small>'+(bad?'<br><small class="bad">⚠ '+(f?'só '+f+' disponível(is)':'indisponível'+(why(it)?' — '+why(it):''))+'</small>':'')+'</div>'+
        '<div class="row">'+(it.mode==='qty'?'<input type="number" class="qty" min="1" max="'+Math.max(1,totalQty(it))+'" value="'+q+'" data-mq="'+esc(id)+'" aria-label="Quantidade">':'')+'<button type="button" class="btn sm danger" data-v="rm" data-id="'+esc(id)+'" aria-label="Remover">✕</button></div></div>';
    }).join('');
    renderTotal();
  };
  const renderSel=()=>{ if(st.rs) return; st.rs=true; try{ renderSelInner(); }finally{ st.rs=false; } };
  const renderPick=()=>{
    const box=$('#mv-pick',m.el), q=norm(st.q.trim());
    let list=S.items.filter(it=>!st.sel.has(it.id)&&(st.tag==='all'||hasTag(it,st.tag))&&(!q||q.split(/\s+/).every(w=>itemSearchText(it).includes(w))));
    const info=new Map(list.map(it=>[it.id,free(it)]));
    list.sort((a,b)=>(info.get(b.id)>0)-(info.get(a.id)>0)||groupKey(a).localeCompare(groupKey(b),'pt')||a.name.localeCompare(b.name,'pt',{numeric:true}));
    const shown=list.slice(0,60);
    box.innerHTML=shown.length?shown.map(it=>{
      const f=info.get(it.id), ok=f>0, isQ=it.mode==='qty';
      return '<div class="arow"><div style="min-width:0"><b>'+esc(it.name)+'</b><br><small class="dim">'+esc([it.model&&it.model!==it.name?it.model:'',it.serial?'S/N '+it.serial:''].filter(Boolean).join(' · ')||groupKey(it))+'</small><br>'+
        (ok?'<small class="good">'+(isQ?f+' disponível(is)':'disponível')+'</small>':'<small class="bad">indisponível'+(why(it)?' — '+esc(why(it)):'')+'</small>')+'</div>'+
        '<div class="row">'+(isQ&&ok?'<input type="number" class="qty" min="1" max="'+f+'" value="1" data-pq="'+esc(it.id)+'" aria-label="Quantidade">':'')+'<button type="button" class="btn sm" data-v="add" data-id="'+esc(it.id)+'"'+(ok?'':' disabled')+'>Adicionar</button></div></div>';
    }).join('')+(list.length>60?'<div class="dim" style="padding:6px;font-size:12px">Mostrando 60 de '+list.length+'. Refine a busca.</div>':''):'<div class="empty" style="border:0">'+(S.items.length?'Nenhum item encontrado (ou todos já foram escolhidos).':'Cadastre itens primeiro.')+'</div>';
  };
  function renderAll(){ renderSel(); renderPick(); }
  fillContacts(); $('#mv-from',m.el).value=st.from; $('#mv-date',m.el).value=st.date; renderKind();

  m.body.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='mv-q'){ st.q=t.value; renderPick(); }
    else if(t.id==='mv-unit'){ st.unit=t.value; renderTotal(); }
    else if(t.id==='mv-note') st.note=t.value;
  });
  m.body.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='mv-contact') st.contactId=t.value;
    else if(t.id==='mv-from'){ st.from=t.value; if(st.until&&st.until<st.from){ st.until=st.from; $('#mv-until',m.el).value=st.until; } renderAll(); }
    else if(t.id==='mv-until'){ st.until=t.value; if(st.until&&st.from&&st.until<st.from){ toast('A devolução não pode ser antes do início','warn'); st.until=''; t.value=''; } renderAll(); }
    else if(t.id==='mv-date') st.date=t.value;
    else if(t.id==='mv-tag'){ st.tag=t.value; renderPick(); }
    else if(t.dataset.mq){ const it=S.itemsById.get(t.dataset.mq); let q=Math.floor(num(t.value)); const mx=it?Math.max(1,it.mode==='qty'?free(it)||1:1):1; if(q<1)q=1; if(q>mx)q=mx; t.value=q; st.sel.set(t.dataset.mq,q); renderSel(); }
  });
  m.el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-v]'); if(!b) return; const a=b.dataset.v;
    if(a==='kind'){ st.kind=b.dataset.kind; renderKind(); }
    else if(a==='add'){
      const it=S.itemsById.get(b.dataset.id); if(!it) return;
      const qi=$('[data-pq="'+b.dataset.id+'"]',m.el); let q=qi?Math.floor(num(qi.value)):1; if(q<1) q=1; const f=free(it); if(q>f) q=f; if(q<1) return;
      st.sel.set(it.id,q); renderAll();
    }
    else if(a==='rm'){ st.sel.delete(b.dataset.id); renderAll(); }
    else if(a==='cnew'){ openContact(null,{onSaved:(cid,data)=>{ st.tmpC.set(cid,data); st.contactId=cid; fillContacts(); setTimeout(fillContacts,250); }}); }
    else if(a==='save') save();
  });
  async function save(){
    if(st.saving) return;
    if(!st.contactId){ toast('Escolha o contato','warn'); $('#mv-contact',m.el).focus(); return; }
    if(!st.sel.size){ toast('Escolha ao menos um equipamento','warn'); return; }
    const rent=isRent(), date=rent?st.from:st.date;
    if(!date){ toast(rent?'Informe a data de início':'Informe a data da venda','warn'); return; }
    if(rent&&st.until&&st.until<st.from){ toast('A devolução não pode ser antes do início','warn'); return; }
    for(const [id,q] of st.sel){ const it=S.itemsById.get(id); if(!it){ toast('Um item escolhido não existe mais','err'); return; } const f=free(it); if(q>f){ toast('“'+it.name+'”: '+(f?'só '+f+' disponível(is)':'indisponível'+(why(it)?' ('+why(it)+')':'')),'warn',4500); return; } }
    if(!rent){
      const t=todayISO(), inEv=Array.from(st.sel.keys()).filter(id=>S.events.some(ev=>ev.status!=='cancelado'&&ev.end>=t&&ev._m.has(id)));
      if(inEv.length&&!await confirmBox(inEv.length+' item(ns) estão em eventos futuros. Vendê-los vai gerar conflito nesses eventos.\nRegistrar a venda mesmo assim?',{ok:'Registrar venda',title:'Itens em eventos'})) return;
    }
    st.saving=true; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=true);
    try{
      const now=Date.now(), u=num(st.unit); let units=0;
      await runBatch(bt=>{
        for(const [id,q] of st.sel){
          const it=S.itemsById.get(id); units+=q;
          const h={id:Math.random().toString(36).slice(2,10),kind:st.kind,contactId:st.contactId,qty:q,from:rent?st.from:'',until:rent?st.until:'',date:rent?'':st.date,price:u?+(u*q).toFixed(2):'',note:st.note.trim(),returnedOn:'',createdAt:now};
          bt.update(db.collection(COL.items).doc(id),{holdings:clean((it.holdings||[]).concat([h])),updatedAt:now});
        }
      });
      const cn=(S.contactsById.get(st.contactId)||st.tmpC.get(st.contactId)||{}).name||'o contato';
      toast((rent?'Aluguel registrado: ':'Venda registrada: ')+units+' un. — '+cn,'ok',3500); m.close();
    }catch(err){ handleWriteError(err); st.saving=false; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=false); }
  }
}

/* ---------- dados em tempo real (Firestore onSnapshot) ---------- */
function checkPending(){
  if(!S.pendingItem||!ready()) return;
  const id=S.pendingItem; S.pendingItem=null;
  if(S.itemsById.has(id)) openItem(id); else toast('Item do QR Code não encontrado (foi excluído?)','warn',4000);
}
function startData(){
  stopData(); if(!db) return;
  const c={items:true,events:true}, p={items:false,events:false};
  const upd=()=>{S.sync.fromCache=c.items||c.events; S.sync.pending=p.items||p.events; updateSync();};
  const onErr=e=>{
    console.error(e); S.loadError=(e&&e.code)||'erro';
    if(S.loadError==='permission-denied'){ showBanner('<span>O Firebase bloqueou o acesso ao estoque.</span><button class="btn sm" data-act="rules">Como liberar</button>','err'); showRulesHelp(); }
    else showBanner('<span>Erro ao sincronizar: '+esc((e&&e.message)||S.loadError)+'</span>','err');
    renderActive(true); updateSync();
  };
  const ok=()=>{ if(S.loadError){ S.loadError=null; showBanner(''); } };
  unsubs.push(db.collection(COL.items).onSnapshot({includeMetadataChanges:true},snap=>{
    const first=!S.loaded.items; c.items=snap.metadata.fromCache; p.items=snap.metadata.hasPendingWrites;
    const changed=first||snap.docChanges().length>0;
    if(changed){
      const stamp=new Map(S.all.map(i=>[i.id,i.photosAt||0]));
      S.all=snap.docs.map(d=>normItem(d.id,d.data()));
      S.itemsById=new Map(S.all.map(i=>[i.id,i]));
      S.items=S.all.filter(i=>totalQty(i)>0);      /* o que foi vendido sai do estoque */
      S.all.forEach(i=>{ if(stamp.has(i.id)&&stamp.get(i.id)!==(i.photosAt||0)) S.photoCache.delete(i.id); });   /* fotos mudaram em outro aparelho */
      S.loaded.items=true; ok();
    }
    upd(); if(changed){ scheduleRender(); checkPending(); }
  },onErr));
  unsubs.push(db.collection(COL.events).onSnapshot({includeMetadataChanges:true},snap=>{
    const first=!S.loaded.events; c.events=snap.metadata.fromCache; p.events=snap.metadata.hasPendingWrites;
    const changed=first||snap.docChanges().length>0;
    if(changed){ S.events=snap.docs.map(d=>normEvent(d.id,d.data())); S.loaded.events=true; ok(); }
    upd(); if(changed){ scheduleRender(); checkPending(); }
  },onErr));
  unsubs.push(db.collection(COL.contacts).onSnapshot(snap=>{
    S.contacts=snap.docs.map(d=>normContact(d.id,d.data())); S.contactsById=new Map(S.contacts.map(c=>[c.id,c]));
    S.loaded.contacts=true; S.contactsError=null; scheduleRender();
  },e=>{ console.error(e); S.contactsError=(e&&e.code)||'erro'; if(S.contactsError==='permission-denied') showRulesHelp(); renderActive(true); }));
  unsubs.push(db.collection(COL.meta).doc('config').onSnapshot(s=>{ S.meta=s.exists?(s.data()||{}):{}; scheduleRender(); },()=>{}));
}

/* ---------- login opcional (REQUIRE_LOGIN = true) ---------- */
function showLogin(){
  if($('#login-box')) return;

/* ---------- link do QR Code: #item=ID ---------- */
function readHash(){
  const mm=/[#&]item=([^&]+)/.exec(location.hash); if(!mm) return;
  S.pendingItem=decodeURIComponent(mm[1]);
  try{ history.replaceState(null,'',location.href.split('#')[0]); }catch(e){}

}

    case 'cal-prev': case 'cal-next': {
      const [y,m]=S.ui.month.split('-').map(Number), d=new Date(y,m-1+(a==='cal-next'?1:-1),1,12);

    case 'c-view': S.ui.cview=S.ui.cview==='group'?'flat':'group'; savePrefs(); renderCategorias(); break;
    case 'c-labels': { const l=filteredItems().filter(i=>i.qrEnabled); openLabels(l); break; }
    case 'ev-filter': S.ui.evFilter=b.dataset.f; savePrefs(); renderEventos(); break;
    case 'goto-rent': S.ui.ctag='__rent'; S.ui.q=''; setTab('categorias'); { const q=$('#c-q'); if(q) q.value=''; renderCategorias(); } break;
    case 'open-contact': openContactView(id); break;
    case 'new-contact': openContact(null); break;
    case 'ct-role': S.ui.crole=b.dataset.role; renderContatos(); break;
    case 'h-return': case 'h-extend': case 'h-del': holdingAction(a,b.dataset.item,b.dataset.hid); break;

    case 'qr-copy': try{await loadQrLib();copyQr(id);}catch(x){toast(x.message,'err',4000);} break;
    case 'qr-png': try{await loadQrLib();downloadQr(id,b.dataset.name);}catch(x){toast(x.message,'err',4000);} break;
    case 'qr-print': { const it=S.itemsById.get(id)||liveDrafts.get(id); openLabels(it?[it]:[]); break; }
    case 'qr-link': copyText(itemUrl(id),'Link copiado'); break;
  }
});

document.addEventListener('input',e=>{
  const t=e.target;

  else if(t.id==='e-q'){ S.ui.evq=t.value; renderEventos(); }
  else if(t.id==='ct-q'){ S.ui.cq=t.value; renderContatos(); }
  else if(t.dataset&&t.dataset.need!==undefined){
    const key=t.dataset.need, n=Math.max(0,Math.floor(num(t.value))); S.ui.need[key]=n;
    const a=S.ui.date, b=(S.ui.end&&S.ui.end>=a)?S.ui.end:a;
    let sc=resolveScope(); if(!scopeItems(sc).length) sc='all';
    const st=rangeStats(scopeItems(sc).filter(i=>groupKey(i)===key),a,b);
    const out=t.closest('.need').querySelector('.need-res'); if(out) out.innerHTML=needResult(st.F,n);
  }
});
window.addEventListener('hashchange',readHash);
window.addEventListener('beforeunload',e=>{ const c=$('#view-cadastrar')._ctx; if(c&&c.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) return;
  const t=todayISO(); if(t!==S.day){ if(S.ui.date===S.day){S.ui.date=t;S.ui.month=t.slice(0,7);} S.day=t; renderActive(true); }
});

/* ---------- start ---------- */
$$('#tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
updateSync();
if(fbError) showBanner('<span>Não foi possível iniciar o Firebase: '+esc(fbError.message||fbError)+'</span>','err');
setTab('geral');
if(db){
  readHash();
  if(REQUIRE_LOGIN&&auth){
    auth.onAuthStateChanged(u=>{
      S.user=u;
      if(u){ const box=$('#login-box'); if(box){ const mm=modalStack.find(x=>x.el.contains(box)); if(mm) mm.close(); } startData(); }
      else { stopData(); showLogin(); }
    });
  } else startData();
}
})();
</script>
</body>
</html>
