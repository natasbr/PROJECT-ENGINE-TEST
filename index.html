<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VR Estoque</title>
<meta name="description" content="VR Estoque - Gestão de Equipamentos, Eventos, Contatos, Kits e Blueprints com Leitor de QR Code integrado.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='30' font-weight='bold' fill='%2300ff00' text-anchor='middle'%3EVR%3C/text%3E%3C/svg%3E">
<style>
:root{
  --g:#0f0; --g-dim:#4fc04f; --g-line:#0b7a0b; --g-faint:#0a3d0a;
  --bg:#000; --bg1:#001400; --bg2:#002200;
  --blue:#00aaff; --blue-bg:#003366;
  --amber:#ffb000; --amber-bg:#3a2800;
  --red:#ff5555; --red-bg:#440000;
  --purple:#bb77ff; --purple-bg:#331155;
  --gray:#8a8a8a;
  --font:'Courier New',Courier,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--g);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;color-scheme:dark}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--blue);cursor:pointer;font-weight:bold;text-decoration:underline dotted;text-align:left}
.linkbtn:hover{color:#fff}
b,strong{font-weight:bold}
small{font-size:12px}
.dim{color:var(--g-dim)}
.hide{display:none!important}
.pre{white-space:pre-wrap}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#001100}
::-webkit-scrollbar-thumb{background:var(--g)}
:focus-visible{outline:2px dashed #b6ffb6;outline-offset:2px}

/* ---------- estrutura do app ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(env(safe-area-inset-top),8px) 14px 8px;border-bottom:1px solid var(--g-line)}
.logo{font-size:19px;font-weight:bold;text-shadow:0 0 6px var(--g)}
.cursor{animation:blink 1.1s steps(1) infinite;font-weight:bold}
@keyframes blink{50%{opacity:0}}
.top-right{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--g-dim);white-space:nowrap}
.sync i{font-style:normal}
.sync.ok i{color:var(--g)}
.sync.wait i{color:var(--amber)}
.sync.off i,.sync.err i{color:var(--red)}
#banner{flex:none}
.banner{padding:8px 14px;border-bottom:1px solid var(--amber);background:var(--amber-bg);color:var(--amber);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--g-line)}
.tabs button{flex:1;padding:11px 6px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--g-dim);cursor:pointer;font-weight:bold;display:flex;gap:8px;align-items:center;justify-content:center}
.tabs button .gl{font-size:16px}
.tabs button:hover{background:rgba(0,255,0,.06)}
.tabs button.active{color:var(--g);border-bottom-color:var(--g);background:rgba(0,255,0,.08);text-shadow:0 0 6px var(--g)}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.view{display:none;max-width:1100px;margin:0 auto}
.view.active{display:block}
@media(max-width:700px){
  .tabs{order:3;border-bottom:0;border-top:1px solid var(--g);padding-bottom:env(safe-area-inset-bottom);background:#000}
  .tabs button{flex-direction:column;gap:2px;font-size:10px;padding:7px 0;border-bottom:0;border-top:3px solid transparent;min-width:0}
  .tabs button.active{border-top-color:var(--g)}
  #main{padding:10px}
}

/* ---------- blocos ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}}
.card{border:1px solid var(--g);background:rgba(0,20,0,.85);border-radius:8px;padding:14px}
.card.glow{box-shadow:0 0 18px rgba(0,255,0,.25)}
.h2{margin:0 0 10px;font-size:16px;font-weight:bold;text-shadow:0 0 5px var(--g);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h2 .t::before{content:'> ';color:var(--g-dim)}
.h3{margin:14px 0 8px;font-size:14px;font-weight:bold;color:var(--g-dim);border-bottom:1px dashed var(--g-faint);padding-bottom:4px}
.empty{padding:18px 10px;text-align:center;color:var(--g-dim);border:1px dashed var(--g-faint);border-radius:6px}
.empty b{color:var(--g);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow1{flex:1;min-width:0}

/* ---------- controles ---------- */
.btn{background:var(--bg2);color:var(--g);border:1px solid var(--g);padding:9px 14px;min-height:40px;cursor:pointer;font-weight:bold;transition:background .15s,color .15s;border-radius:2px}
.btn:hover:not(:disabled){background:var(--g);color:#000}
.btn:disabled{background:#222;color:#777;border-color:#555;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.pri{background:#004a00;box-shadow:0 0 8px rgba(0,255,0,.35)}
.btn.blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.btn.blue:hover:not(:disabled){background:var(--blue);color:#000}
.btn.purple{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.btn.purple:hover:not(:disabled){background:var(--purple);color:#fff}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.danger:hover:not(:disabled){background:var(--red);color:#000}
.btn.ghost{background:transparent}
.btn.full{width:100%}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=password],input[type=email],select,textarea{background:#000;color:var(--g);border:1px solid var(--g);padding:9px 10px;width:100%;min-height:40px;outline:none;border-radius:0;font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 1px var(--g),0 0 10px rgba(0,255,0,.45)}
input::placeholder,textarea::placeholder{color:#2c8a2c}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(58%) sepia(96%) saturate(700%) hue-rotate(75deg)}
input[type=checkbox]{width:20px;height:20px;accent-color:#0f0;flex:none}
select option{background:#000;color:#0f0}
select optgroup{background:#001400;color:var(--g-dim);font-weight:bold}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--g-dim)}
.field .hint{font-size:11px;color:var(--g-dim)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.field.full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar>.grow1{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--g-line);background:#000;color:var(--g);padding:4px 10px;cursor:pointer;font-size:13px;border-radius:2px;min-height:30px}
.chip:hover{border-color:var(--g)}
.chip.on{background:var(--g);color:#000;font-weight:bold}
.chip .n{color:var(--g-dim);margin-left:4px}
.chip.on .n{color:#003300}
.chip.x{border-color:var(--blue);color:var(--blue)}
.chip.sp{border-color:var(--blue);color:var(--blue)}
.chip.sp.on{background:var(--blue);color:#000}
.chip.sp.on .n{color:#003355}
.chip.bp{border-color:var(--purple);color:var(--purple)}
.chip.bp.on{background:var(--purple);color:#fff}
.chip.bp.on .n{color:#330066}

/* ---------- selos e barras ---------- */
.badge{display:inline-block;border:1px solid var(--g);padding:0 6px;font-size:12px;line-height:1.5;white-space:nowrap;border-radius:2px}
.st-disponivel,.ph-andamento{border-color:var(--g);color:var(--g)}
.st-manutencao{border-color:var(--amber);color:var(--amber)}
.st-danificado,.st-perdido,.st-cancelado{border-color:var(--red);color:var(--red)}
.st-baixado,.ph-passado{border-color:var(--gray);color:var(--gray)}
.st-alugado{border-color:var(--blue);color:var(--blue)}
.st-vendido{border-color:var(--amber);color:var(--amber)}
.st-planejado,.ph-proximo{border-color:var(--blue);color:var(--blue)}
.st-confirmado{border-color:var(--g);color:var(--g)}
.st-kit{border-color:var(--purple);color:var(--purple);background:rgba(187,119,255,.1)}
.tag{display:inline-block;border:1px solid var(--blue);color:var(--blue);padding:0 6px;font-size:12px;background:rgba(0,102,204,.12);border-radius:2px}
.tag.rm{cursor:pointer}
.cond{white-space:nowrap;font-size:12px}
.cond .m{letter-spacing:1px}
.c5,.c4{color:var(--g)}.c3{color:#9ad86a}.c2{color:var(--amber)}.c1{color:var(--red)}
.bar{font-family:var(--font);line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:0}
.bar .bf{color:var(--g)}.bar .br{color:var(--blue)}.bar .bu{color:var(--amber)}.bar .bo{color:#1c5a1c}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--g-dim)}
.legend .bf{color:var(--g)}.legend .br{color:var(--blue)}.legend .bu{color:var(--amber)}
.warn{color:var(--amber)}.bad{color:var(--red)}.good{color:var(--g)}

/* ---------- geral ---------- */
.hero-num{font-size:clamp(34px,10vw,54px);font-weight:bold;line-height:1;text-shadow:0 0 12px var(--g)}
.hero-num small{font-size:clamp(14px,3.6vw,18px);text-shadow:none;color:var(--g-dim);font-weight:normal}
.hero-bar{font-size:clamp(14px,4.6vw,22px);margin:10px 0 8px}
.trio{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.trio div{display:flex;flex-direction:column}
.trio b{font-size:18px}
.trio span{font-size:12px;color:var(--g-dim)}
.grp{border:1px solid var(--g-faint);padding:10px;background:#000;border-radius:4px}
.grp+.grp{margin-top:8px}
.grp.sel{border-color:var(--g)}
.grp-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grp-top b{overflow:hidden;text-overflow:ellipsis}
.grp .bar{font-size:14px;margin:6px 0 4px}
.grp-sub{font-size:12px;color:var(--g-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.need{display:flex;gap:6px;align-items:center;font-size:12px}
.need input{width:64px;min-height:30px;padding:2px 6px;font-size:14px}
.need-res{min-width:90px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:11px;color:var(--g-dim)}
.cday{min-height:52px;border:1px solid var(--g-faint);background:#000;color:var(--g);padding:2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;border-radius:2px}
.cday:hover{border-color:var(--g)}
.cday .dn{font-size:10px;align-self:flex-start;color:var(--g-dim);line-height:1}
.cday .fv{font-size:17px;font-weight:bold;line-height:1}
.cday .ev{font-size:9px;height:10px;line-height:10px;color:var(--blue)}
.cday.out{opacity:.35}
.cday.today{outline:1px dashed var(--g);outline-offset:-2px}
.cday.inr{background:#002a00;border-color:var(--g-line)}
.cday.sel{background:#003a00;border-color:var(--g);box-shadow:0 0 8px rgba(0,255,0,.6)}
.f-ok{color:var(--g)}.f-low{color:var(--amber)}.f-zero{color:var(--red)}.f-na{color:#245c24}
.erow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:#000;border:1px solid var(--g-faint);padding:9px 10px;cursor:pointer;color:var(--g);border-radius:4px}
.erow+.erow,.irow+.irow{margin-top:8px}
.erow:hover,.irow:hover{border-color:var(--g);background:#001a00}
.edate{text-align:center;min-width:54px;border-right:1px dashed var(--g-faint);padding-right:10px}
.edate b{font-size:16px;display:block;line-height:1.1}
.edate small{color:var(--g-dim)}
.emain{min-width:0;display:flex;flex-direction:column;gap:2px}
.emain b,.imain b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emain small,.imain small{color:var(--g-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emeta,.imeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;text-align:right}
.alert{border:1px solid var(--amber);color:var(--amber);background:var(--amber-bg);padding:8px 10px;border-radius:4px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.alert.red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.alert+.alert{margin-top:6px}

/* ---------- categorias ---------- */
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--g-line);font-weight:bold}
.cat-h:first-child{margin-top:0}
.cat-h small{color:var(--g-dim);font-weight:normal}
.irow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:#000;border:1px solid var(--g-faint);padding:8px;cursor:pointer;color:var(--g);border-radius:4px}
.thumb{width:52px;height:52px;border:1px solid var(--g-line);background:#001100;display:flex;align-items:center;justify-content:center;color:#1f6f1f;overflow:hidden;font-size:12px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imain{min-width:0;display:flex;flex-direction:column;gap:2px}
.thumb.ini{font-weight:bold;font-size:16px;color:var(--g);background:var(--bg2)}
.tagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

/* ---------- janelas ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:100%;max-width:780px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:#000d00;border:2px solid var(--g);box-shadow:0 0 22px rgba(0,255,0,.35);border-radius:10px;overflow:hidden}
.sheet.small{max-width:440px}
.sheet.wide{max-width:960px}
.sheet-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g-line)}
.sheet-head h2{margin:0;font-size:16px;text-shadow:0 0 5px var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--g-line);background:#000d00}
@media(max-width:640px){
  .modal{padding:0;align-items:stretch}
  .sheet,.sheet.small,.sheet.wide{max-width:none;max-height:none;height:100vh;height:100dvh;border-radius:0;border-width:0;border-top:1px solid var(--g)}
  .sheet.small{height:auto;max-height:100dvh;align-self:flex-end;border-top:2px solid var(--g)}
  .sheet-foot .btn{flex:1 1 auto}
}
.toasts,#toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
@media(min-width:701px){#toasts{bottom:84px}}
.toast{background:#001a00;border:1px solid var(--g);padding:8px 14px;box-shadow:0 0 12px rgba(0,255,0,.4);max-width:520px;border-radius:4px;color:var(--g)}
.toast.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.toast.err{border-color:var(--red);color:var(--red);background:var(--red-bg)}

/* ---------- detalhe do item ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.kv div{min-width:0}
.kv span{display:block;font-size:11px;color:var(--g-dim)}
.kv b{display:block;overflow-wrap:anywhere}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.photos .ph{flex:none;width:120px;height:120px;border:1px solid var(--g-line);background:#001100;position:relative;cursor:pointer;overflow:hidden}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .x{position:absolute;top:2px;right:2px;background:#000;border:1px solid var(--red);color:var(--red);padding:0 6px;cursor:pointer;min-height:26px}
.photos .ph .cv{position:absolute;left:2px;bottom:2px;background:#000;border:1px solid var(--g);color:var(--g);font-size:11px;padding:0 4px;cursor:pointer}
.photos .add{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--g);border-style:dashed}
.viewer{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--g)}
.tl{border-left:2px solid var(--g-line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;padding-bottom:10px}
.tl .it::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;background:var(--g)}
.tl .it small{color:var(--g-dim)}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.qrbox .qr{width:132px;height:132px;background:#fff;padding:0;flex:none}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox .acts{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
.qrbox .link{font-size:11px;color:var(--g-dim);overflow-wrap:anywhere}
.sect{border:1px solid var(--g-faint);border-radius:6px;padding:12px;background:rgba(0,20,0,.55)}
.sect+.sect{margin-top:12px}
.sect>.h3:first-child{margin-top:0}
.tagsin{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--g);padding:6px;background:#000;min-height:44px;align-items:center}
.tagsin input{flex:1;min-width:120px;border:0;padding:4px;min-height:30px;box-shadow:none!important}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-bottom:1px dashed var(--g-faint);padding:6px 0}
.mrow:last-child{border-bottom:0}
.crow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.actionbar{position:sticky;bottom:-14px;margin:14px -14px -14px;padding:10px 14px;background:#000d00;border-top:1px solid var(--g-line);display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.sheet-body .actionbar{bottom:-14px}
@media(max-width:700px){#main .actionbar{bottom:-10px;margin:14px -10px -10px}}

/* ---------- evento: equipamentos ---------- */
.arow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--g-faint);padding:6px 8px;background:#000;border-radius:4px}
.arow+.arow{margin-top:6px}
.arow.bad{border-color:var(--red)}
.arow.flash{animation:greenflash .6s ease-out}
@keyframes greenflash{0%{background:#005500;border-color:#0f0}100%{background:#000;border-color:var(--g-faint)}}
.pick{max-height:280px;overflow-y:auto;border:1px solid var(--g-faint);padding:6px;background:#000}
input[type=number].qty,.qty{width:70px;min-height:32px;padding:2px 6px;font-size:14px}
.row>.qty{flex:none}
.sumtbl{width:100%;border-collapse:collapse;font-size:13px}
.sumtbl td,.sumtbl th{border-bottom:1px dashed var(--g-faint);padding:4px 6px;text-align:right}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl th{color:var(--g-dim);font-weight:normal}
.codebox{background:#000;border:1px solid var(--g-line);padding:10px;overflow-x:auto;font-size:12px;white-space:pre}

/* ---------- scanner de câmera (html5-qrcode) ---------- */
.scanner-box{border:2px solid var(--g);background:#000;border-radius:8px;padding:8px;overflow:hidden;position:relative}
#qr-reader-container{width:100%;min-height:260px;max-height:360px;background:#001100;border-radius:4px;overflow:hidden;position:relative}
#qr-reader-container video{object-fit:cover;width:100%!important;border-radius:4px}
.scan-laser{position:absolute;top:0;left:0;right:0;height:2px;background:var(--g);box-shadow:0 0 8px var(--g);animation:laser 2s infinite ease-in-out;z-index:2;pointer-events:none}
@keyframes laser{0%{top:10%}50%{top:90%}100%{top:10%}}
.scan-feed{margin-top:8px;font-size:12px;color:var(--g-dim);display:flex;justify-content:space-between;align-items:center}
.scan-success-badge{background:#003300;border:1px solid var(--g);color:var(--g);padding:4px 8px;border-radius:4px;display:inline-block;animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- kit cards ---------- */
.kit-card{border:1px solid var(--g-line);background:#000d00;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kit-card.ok{border-color:var(--g)}
.kit-card.warn{border-color:var(--amber)}
.kit-card.bad{border-color:var(--red)}
.kit-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kit-pieces{display:flex;flex-direction:column;gap:4px;background:#000;border:1px solid var(--g-faint);border-radius:4px;padding:8px}
.kit-piece-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0;border-bottom:1px dashed var(--g-faint)}
.kit-piece-row:last-child{border-bottom:0}

/* ---------- etiquetas / impressão ---------- */
.label-sheet{display:flex;flex-wrap:wrap;gap:3mm;align-items:flex-start}
.label{background:#fff;color:#000;border:1px dashed #888;padding:2mm;display:flex;gap:2.5mm;align-items:center;break-inside:avoid;font-family:'Courier New',Courier,monospace;width:var(--lw,70mm)}
.label .lq{width:var(--lq,30mm);height:var(--lq,30mm);flex:none}
.label .lq svg{width:100%;height:100%;display:block}
.label .lt{display:flex;flex-direction:column;min-width:0;font-size:var(--lf,9pt);line-height:1.25;overflow-wrap:anywhere}
.label .lt b{font-size:calc(var(--lf,9pt) + 1pt)}
.ls-s{--lw:52mm;--lq:22mm;--lf:7pt}
.ls-m{--lw:70mm;--lq:30mm;--lf:9pt}
.ls-l{--lw:95mm;--lq:45mm;--lf:11pt}
#print-portal{display:none}
@media print{
  html,body{height:auto!important;background:#fff!important;overflow:visible!important}
  #app,#modal-root,#toasts{display:none!important}
  #print-portal{display:block!important}
  @page{margin:8mm}
}
@media(prefers-reduced-motion:reduce){.cursor,.scan-laser{animation:none}*{transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">VR ESTOQUE</span><span class="cursor logo">_</span></div>
    <div class="top-right">
      <span id="sync" class="sync wait"><i>◌</i><span>Conectando…</span></span>
      <button class="btn sm" data-act="settings" aria-label="Configurações" title="Configurações">⚙</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-tab="geral" role="tab"><span class="gl">◈</span><span>Geral</span></button>
    <button data-tab="cadastrar" role="tab"><span class="gl">+</span><span>Cadastrar</span></button>
    <button data-tab="kits" role="tab"><span class="gl">⚅</span><span>Kits</span></button>
    <button data-tab="categorias" role="tab"><span class="gl">≡</span><span>Categorias</span></button>
    <button data-tab="eventos" role="tab"><span class="gl">▦</span><span>Eventos</span></button>

  </nav>
  <main id="main">
    <section id="view-geral" class="view"></section>
    <section id="view-cadastrar" class="view"></section>
    <section id="view-kits" class="view"></section>
    <section id="view-categorias" class="view"></section>
    <section id="view-eventos" class="view"></section>
    <section id="view-contatos" class="view"></section>
  </main>
</div>

<div id="toasts"></div>
<div id="print-portal"></div>
