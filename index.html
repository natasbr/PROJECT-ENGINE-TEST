<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VR Estoque</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='30' font-weight='bold' fill='%2300ff00' text-anchor='middle'%3EVR%3C/text%3E%3C/svg%3E">
<style>
:root{
  --g:#0f0; --g-dim:#4fc04f; --g-line:#0b7a0b; --g-faint:#0a3d0a;
  --bg:#000; --bg1:#001400; --bg2:#002200;
  --blue:#00aaff; --blue-bg:#003366;
  --amber:#ffb000; --amber-bg:#3a2800;
  --red:#ff5555; --red-bg:#440000;
  --gray:#8a8a8a;
  --font:'Courier New',Courier,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--g);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;color-scheme:dark}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--blue);cursor:pointer;font-weight:bold;text-decoration:underline dotted;text-align:left}
.linkbtn:hover{color:#fff}
b,strong{font-weight:bold}
small{font-size:12px}
.dim{color:var(--g-dim)}
.hide{display:none!important}
.pre{white-space:pre-wrap}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#001100}
::-webkit-scrollbar-thumb{background:var(--g)}
:focus-visible{outline:2px dashed #b6ffb6;outline-offset:2px}

/* ---------- estrutura do app ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(env(safe-area-inset-top),8px) 14px 8px;border-bottom:1px solid var(--g-line)}
.logo{font-size:19px;font-weight:bold;text-shadow:0 0 6px var(--g)}
.cursor{animation:blink 1.1s steps(1) infinite;font-weight:bold}
@keyframes blink{50%{opacity:0}}
.top-right{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--g-dim);white-space:nowrap}
.sync i{font-style:normal}
.sync.ok i{color:var(--g)}
.sync.wait i{color:var(--amber)}
.sync.off i,.sync.err i{color:var(--red)}
#banner{flex:none}
.banner{padding:8px 14px;border-bottom:1px solid var(--amber);background:var(--amber-bg);color:var(--amber);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.err{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--g-line)}
.tabs button{flex:1;padding:11px 6px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--g-dim);cursor:pointer;font-weight:bold;display:flex;gap:8px;align-items:center;justify-content:center}
.tabs button .gl{font-size:16px}
.tabs button:hover{background:rgba(0,255,0,.06)}
.tabs button.active{color:var(--g);border-bottom-color:var(--g);background:rgba(0,255,0,.08);text-shadow:0 0 6px var(--g)}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.view{display:none;max-width:1100px;margin:0 auto}
.view.active{display:block}
@media(max-width:700px){
  .tabs{order:3;border-bottom:0;border-top:1px solid var(--g);padding-bottom:env(safe-area-inset-bottom);background:#000}
  .tabs button{flex-direction:column;gap:2px;font-size:11px;padding:8px 0;border-bottom:0;border-top:3px solid transparent;min-width:0}
  .tabs button.active{border-top-color:var(--g)}
  #main{padding:10px}
}

/* ---------- blocos ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}}
.card{border:1px solid var(--g);background:rgba(0,20,0,.85);border-radius:8px;padding:14px}
.card.glow{box-shadow:0 0 18px rgba(0,255,0,.25)}
.h2{margin:0 0 10px;font-size:16px;font-weight:bold;text-shadow:0 0 5px var(--g);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h2 .t::before{content:'> ';color:var(--g-dim)}
.h3{margin:14px 0 8px;font-size:14px;font-weight:bold;color:var(--g-dim);border-bottom:1px dashed var(--g-faint);padding-bottom:4px}
.empty{padding:18px 10px;text-align:center;color:var(--g-dim);border:1px dashed var(--g-faint);border-radius:6px}
.empty b{color:var(--g);display:block;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow1{flex:1;min-width:0}

/* ---------- controles ---------- */
.btn{background:var(--bg2);color:var(--g);border:1px solid var(--g);padding:9px 14px;min-height:40px;cursor:pointer;font-weight:bold;transition:background .15s,color .15s;border-radius:2px}
.btn:hover:not(:disabled){background:var(--g);color:#000}
.btn:disabled{background:#222;color:#777;border-color:#555;cursor:not-allowed}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.pri{background:#004a00;box-shadow:0 0 8px rgba(0,255,0,.35)}
.btn.blue{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.btn.blue:hover:not(:disabled){background:var(--blue);color:#000}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.danger:hover:not(:disabled){background:var(--red);color:#000}
.btn.ghost{background:transparent}
.btn.full{width:100%}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],input[type=password],input[type=email],select,textarea{background:#000;color:var(--g);border:1px solid var(--g);padding:9px 10px;width:100%;min-height:40px;outline:none;border-radius:0;font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 1px var(--g),0 0 10px rgba(0,255,0,.45)}
input::placeholder,textarea::placeholder{color:#2c8a2c}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(58%) sepia(96%) saturate(700%) hue-rotate(75deg)}
input[type=checkbox]{width:20px;height:20px;accent-color:#0f0;flex:none}
select option{background:#000;color:#0f0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--g-dim)}
.field .hint{font-size:11px;color:var(--g-dim)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.field.full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar>.grow1{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--g-line);background:#000;color:var(--g);padding:4px 10px;cursor:pointer;font-size:13px;border-radius:2px;min-height:30px}
.chip:hover{border-color:var(--g)}
.chip.on{background:var(--g);color:#000;font-weight:bold}
.chip .n{color:var(--g-dim);margin-left:4px}
.chip.on .n{color:#003300}
.chip.x{border-color:var(--blue);color:var(--blue)}
.chip.sp{border-color:var(--blue);color:var(--blue)}
.chip.sp.on{background:var(--blue);color:#000}
.chip.sp.on .n{color:#003355}

/* ---------- selos e barras ---------- */
.badge{display:inline-block;border:1px solid var(--g);padding:0 6px;font-size:12px;line-height:1.5;white-space:nowrap;border-radius:2px}
.st-disponivel,.ph-andamento{border-color:var(--g);color:var(--g)}
.st-manutencao{border-color:var(--amber);color:var(--amber)}
.st-danificado,.st-perdido,.st-cancelado{border-color:var(--red);color:var(--red)}
.st-baixado,.ph-passado{border-color:var(--gray);color:var(--gray)}
.st-alugado{border-color:var(--blue);color:var(--blue)}
.st-vendido{border-color:var(--amber);color:var(--amber)}
.st-planejado,.ph-proximo{border-color:var(--blue);color:var(--blue)}
.st-confirmado{border-color:var(--g);color:var(--g)}
.tag{display:inline-block;border:1px solid var(--blue);color:var(--blue);padding:0 6px;font-size:12px;background:rgba(0,102,204,.12);border-radius:2px}
.tag.rm{cursor:pointer}
.cond{white-space:nowrap;font-size:12px}
.cond .m{letter-spacing:1px}
.c5,.c4{color:var(--g)}.c3{color:#9ad86a}.c2{color:var(--amber)}.c1{color:var(--red)}
.bar{font-family:var(--font);line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:0}
.bar .bf{color:var(--g)}.bar .br{color:var(--blue)}.bar .bu{color:var(--amber)}.bar .bo{color:#1c5a1c}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--g-dim)}
.legend .bf{color:var(--g)}.legend .br{color:var(--blue)}.legend .bu{color:var(--amber)}
.warn{color:var(--amber)}.bad{color:var(--red)}.good{color:var(--g)}

/* ---------- geral ---------- */
.hero-num{font-size:clamp(34px,10vw,54px);font-weight:bold;line-height:1;text-shadow:0 0 12px var(--g)}
.hero-num small{font-size:clamp(14px,3.6vw,18px);text-shadow:none;color:var(--g-dim);font-weight:normal}
.hero-bar{font-size:clamp(14px,4.6vw,22px);margin:10px 0 8px}
.trio{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.trio div{display:flex;flex-direction:column}
.trio b{font-size:18px}
.trio span{font-size:12px;color:var(--g-dim)}
.grp{border:1px solid var(--g-faint);padding:10px;background:#000;border-radius:4px}
.grp+.grp{margin-top:8px}
.grp.sel{border-color:var(--g)}
.grp-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grp-top b{overflow:hidden;text-overflow:ellipsis}
.grp .bar{font-size:14px;margin:6px 0 4px}
.grp-sub{font-size:12px;color:var(--g-dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.need{display:flex;gap:6px;align-items:center;font-size:12px}
.need input{width:64px;min-height:30px;padding:2px 6px;font-size:14px}
.need-res{min-width:90px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:11px;color:var(--g-dim)}
.cday{min-height:52px;border:1px solid var(--g-faint);background:#000;color:var(--g);padding:2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;border-radius:2px}
.cday:hover{border-color:var(--g)}
.cday .dn{font-size:10px;align-self:flex-start;color:var(--g-dim);line-height:1}
.cday .fv{font-size:17px;font-weight:bold;line-height:1}
.cday .ev{font-size:9px;height:10px;line-height:10px;color:var(--blue)}
.cday.out{opacity:.35}
.cday.today{outline:1px dashed var(--g);outline-offset:-2px}
.cday.inr{background:#002a00;border-color:var(--g-line)}
.cday.sel{background:#003a00;border-color:var(--g);box-shadow:0 0 8px rgba(0,255,0,.6)}
.f-ok{color:var(--g)}.f-low{color:var(--amber)}.f-zero{color:var(--red)}.f-na{color:#245c24}
.erow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:#000;border:1px solid var(--g-faint);padding:9px 10px;cursor:pointer;color:var(--g);border-radius:4px}
.erow+.erow,.irow+.irow{margin-top:8px}
.erow:hover,.irow:hover{border-color:var(--g);background:#001a00}
.edate{text-align:center;min-width:54px;border-right:1px dashed var(--g-faint);padding-right:10px}
.edate b{font-size:16px;display:block;line-height:1.1}
.edate small{color:var(--g-dim)}
.emain{min-width:0;display:flex;flex-direction:column;gap:2px}
.emain b,.imain b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emain small,.imain small{color:var(--g-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emeta,.imeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;text-align:right}
.alert{border:1px solid var(--amber);color:var(--amber);background:var(--amber-bg);padding:8px 10px;border-radius:4px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.alert.red{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.alert+.alert{margin-top:6px}

/* ---------- categorias ---------- */
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--g-line);font-weight:bold}
.cat-h:first-child{margin-top:0}
.cat-h small{color:var(--g-dim);font-weight:normal}
.irow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:#000;border:1px solid var(--g-faint);padding:8px;cursor:pointer;color:var(--g);border-radius:4px}
.thumb{width:52px;height:52px;border:1px solid var(--g-line);background:#001100;display:flex;align-items:center;justify-content:center;color:#1f6f1f;overflow:hidden;font-size:12px;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.imain{min-width:0;display:flex;flex-direction:column;gap:2px}
.thumb.ini{font-weight:bold;font-size:16px;color:var(--g);background:var(--bg2)}
.tagline{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

/* ---------- janelas ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:100%;max-width:780px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:#000d00;border:2px solid var(--g);box-shadow:0 0 22px rgba(0,255,0,.35);border-radius:10px;overflow:hidden}
.sheet.small{max-width:440px}
.sheet.wide{max-width:960px}
.sheet-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--g-line)}
.sheet-head h2{margin:0;font-size:16px;text-shadow:0 0 5px var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--g-line);background:#000d00}
@media(max-width:640px){
  .modal{padding:0;align-items:stretch}
  .sheet,.sheet.small,.sheet.wide{max-width:none;max-height:none;height:100vh;height:100dvh;border-radius:0;border-width:0;border-top:1px solid var(--g)}
  .sheet.small{height:auto;max-height:100dvh;align-self:flex-end;border-top:2px solid var(--g)}
  .sheet-foot .btn{flex:1 1 auto}
}
.toasts,#toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
@media(min-width:701px){#toasts{bottom:84px}}
.toast{background:#001a00;border:1px solid var(--g);padding:8px 14px;box-shadow:0 0 12px rgba(0,255,0,.4);max-width:520px;border-radius:4px}
.toast.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.toast.err{border-color:var(--red);color:var(--red);background:var(--red-bg)}

/* ---------- detalhe do item ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px}
.kv div{min-width:0}
.kv span{display:block;font-size:11px;color:var(--g-dim)}
.kv b{display:block;overflow-wrap:anywhere}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.photos .ph{flex:none;width:120px;height:120px;border:1px solid var(--g-line);background:#001100;position:relative;cursor:pointer;overflow:hidden}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .x{position:absolute;top:2px;right:2px;background:#000;border:1px solid var(--red);color:var(--red);padding:0 6px;cursor:pointer;min-height:26px}
.photos .ph .cv{position:absolute;left:2px;bottom:2px;background:#000;border:1px solid var(--g);color:var(--g);font-size:11px;padding:0 4px;cursor:pointer}
.photos .add{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--g);border-style:dashed}
.viewer{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--g)}
.tl{border-left:2px solid var(--g-line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;padding-bottom:10px}
.tl .it::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;background:var(--g)}
.tl .it small{color:var(--g-dim)}
.qrbox{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.qrbox .qr{width:132px;height:132px;background:#fff;padding:0;flex:none}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox .acts{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
.qrbox .link{font-size:11px;color:var(--g-dim);overflow-wrap:anywhere}
.sect{border:1px solid var(--g-faint);border-radius:6px;padding:12px;background:rgba(0,20,0,.55)}
.sect+.sect{margin-top:12px}
.sect>.h3:first-child{margin-top:0}
.tagsin{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--g);padding:6px;background:#000;min-height:44px;align-items:center}
.tagsin input{flex:1;min-width:120px;border:0;padding:4px;min-height:30px;box-shadow:none!important}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-bottom:1px dashed var(--g-faint);padding:6px 0}
.mrow:last-child{border-bottom:0}
.crow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.actionbar{position:sticky;bottom:-14px;margin:14px -14px -14px;padding:10px 14px;background:#000d00;border-top:1px solid var(--g-line);display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.sheet-body .actionbar{bottom:-14px}
@media(max-width:700px){#main .actionbar{bottom:-10px;margin:14px -10px -10px}}

/* ---------- evento: equipamentos ---------- */
.arow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--g-faint);padding:6px 8px;background:#000;border-radius:4px}
.arow+.arow{margin-top:6px}
.arow.bad{border-color:var(--red)}
.pick{max-height:280px;overflow-y:auto;border:1px solid var(--g-faint);padding:6px;background:#000}
input[type=number].qty,.qty{width:70px;min-height:32px;padding:2px 6px;font-size:14px}
.row>.qty{flex:none}
.sumtbl{width:100%;border-collapse:collapse;font-size:13px}
.sumtbl td,.sumtbl th{border-bottom:1px dashed var(--g-faint);padding:4px 6px;text-align:right}
.sumtbl td:first-child,.sumtbl th:first-child{text-align:left}
.sumtbl th{color:var(--g-dim);font-weight:normal}
.codebox{background:#000;border:1px solid var(--g-line);padding:10px;overflow-x:auto;font-size:12px;white-space:pre}

/* ---------- etiquetas / impressão ---------- */
.label-sheet{display:flex;flex-wrap:wrap;gap:3mm;align-items:flex-start}
.label{background:#fff;color:#000;border:1px dashed #888;padding:2mm;display:flex;gap:2.5mm;align-items:center;break-inside:avoid;font-family:'Courier New',Courier,monospace;width:var(--lw,70mm)}
.label .lq{width:var(--lq,30mm);height:var(--lq,30mm);flex:none}
.label .lq svg{width:100%;height:100%;display:block}
.label .lt{display:flex;flex-direction:column;min-width:0;font-size:var(--lf,9pt);line-height:1.25;overflow-wrap:anywhere}
.label .lt b{font-size:calc(var(--lf,9pt) + 1pt)}
.ls-s{--lw:52mm;--lq:22mm;--lf:7pt}
.ls-m{--lw:70mm;--lq:30mm;--lf:9pt}
.ls-l{--lw:95mm;--lq:45mm;--lf:11pt}
#print-portal{display:none}
@media print{
  html,body{height:auto!important;background:#fff!important;overflow:visible!important}
  #app,#modal-root,#toasts{display:none!important}
  #print-portal{display:block!important}
  @page{margin:8mm}
}

<script>
(function(){
'use strict';

/* =====================================================================
   VR ESTOQUE — app de gestão de equipamentos (arquivo único)
   Dados: Firebase Firestore (mesmo projeto do Dream Engine),
   mas SOMENTE nas coleções vrm_* abaixo. A galeria (gallery_objects)
   não é lida nem alterada por este app.
   ===================================================================== */

/* Configuração do Firebase — cópia exata do projeto que você enviou */
const firebaseConfig = {
  apiKey: "AIzaSyAnXII96RwOSs7p-cdvmch7_S3A2-rcLEc",
  authDomain: "project-engine-2f962.firebaseapp.com",
  projectId: "project-engine-2f962",
  storageBucket: "project-engine-2f962.firebasestorage.app",
  messagingSenderId: "17396805461",
  appId: "1:17396805461:web:11463e56e27a760eaec9dc",
  measurementId: "G-EDTS1HS7T8"
};

/* Coleções exclusivas deste app (não cruzam com a galeria online) */
const COL = { items:'vrm_items', events:'vrm_events', photos:'vrm_photos', meta:'vrm_meta', contacts:'vrm_contacts' };

/* Login opcional. false = abre direto (mais simples).
   true  = exige e-mail/senha do Firebase Auth (mais seguro; veja o guia). */
const REQUIRE_LOGIN = true;

/* ---------- utilitários ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const num = v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const pad = n=>String(n).padStart(2,'0');
const iso = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = ()=>iso(new Date());
const parseISO = s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const addDays = (s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays = (a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const eachDay = (a,b)=>{const out=[];let c=a,g=0;while(c<=b&&g++<800){out.push(c);c=addDays(c,1);}return out;};
const fmtDate = s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;};
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtShort = s=>{const [y,m,d]=s.split('-').map(Number);return d+' '+MON3[m-1];};
const fmtRange = (a,b)=>a===b?fmtDate(a):fmtDate(a)+' a '+fmtDate(b);
const money = v=>num(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const clone = o=>JSON.parse(JSON.stringify(o));
const slug = s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item';

/* ---------- listas fixas ---------- */
const STATUS = [['disponivel','Disponível'],['manutencao','Em manutenção'],['danificado','Danificado'],['perdido','Perdido'],['baixado','Baixado (descartado)']];
const CONDITION = [['novo','Novo'],['otimo','Ótimo'],['bom','Bom'],['regular','Regular'],['ruim','Ruim']];
const COND_LEVEL = {novo:5,otimo:4,bom:3,regular:2,ruim:1};
const EV_STATUS = [['planejado','Planejado'],['confirmado','Confirmado'],['cancelado','Cancelado']];
const MAINT_TYPES = ['Preventiva','Corretiva','Limpeza','Bateria','Software / firmware','Peças / reparo','Outro'];
const label = (list,k)=>{const f=list.find(x=>x[0]===k);return f?f[1]:(k||'');};

/* =====================================================================
   CAMPOS DO ITEM — para adicionar um detalhe novo, é só incluir UMA
   linha aqui. Ele aparece sozinho no formulário, no detalhe e é salvo.
   Opções: sec (seção), key, label, type (text|number|date|select|textarea),
   options, req, suggest (autocompletar), showIf(draft), reflow (redesenha
   o formulário ao mudar), ph, hint, fmt(valor)
   ===================================================================== */
const ITEM_FIELDS = [
  {sec:'Identificação', key:'name',      label:'Nome do item', type:'text', req:true, ph:'Ex.: Quest 3 nº 07'},
  {sec:'Identificação', key:'model',     label:'Modelo / tipo', type:'text', suggest:true, ph:'Ex.: Meta Quest 3 128 GB', hint:'Itens com o mesmo modelo são somados na tela Geral'},
  {sec:'Identificação', key:'brand',     label:'Marca', type:'text', suggest:true, ph:'Ex.: Meta, BOBOVR'},
  {sec:'Identificação', key:'serial',    label:'Nº de série', type:'text'},
  {sec:'Estoque', key:'mode',      label:'Controle', type:'select', options:[['unit','Unidade única'],['qty','Por quantidade (lote)']], reflow:true, hint:'Use "lote" para itens sem série individual (cabos, canetas…)'},
  {sec:'Estoque', key:'qty',       label:'Quantidade total', type:'number', min:1, step:'1', showIf:d=>d.mode==='qty', hint:'Vendas são descontadas automaticamente'},
  {sec:'Estoque', key:'unavailQty',label:'Quantidade indisponível', type:'number', min:0, step:'1', showIf:d=>d.mode==='qty', hint:'Quebradas ou em manutenção'},
  {sec:'Estoque', key:'status',    label:'Situação', type:'select', options:STATUS, reflow:true},
  {sec:'Estoque', key:'backOn',    label:'Volta a ficar disponível em', type:'date', showIf:d=>d.status==='manutencao'||d.status==='danificado', hint:'Opcional. Libera o item nas datas a partir deste dia'},
  {sec:'Estoque', key:'condition', label:'Estado de conservação', type:'select', options:CONDITION},
  {sec:'Estoque', key:'location',  label:'Guardado em', type:'text', suggest:true, ph:'Ex.: Armário 2, Caixa azul'},
  {sec:'Compra',  key:'acquiredOn',label:'Data de aquisição', type:'date'},
  {sec:'Compra',  key:'value',     label:'Valor pago (R$)', type:'number', min:0, step:'0.01', fmt:v=>money(v)},
  {sec:'Compra',  key:'supplier',  label:'Fornecedor', type:'text', suggest:true},
  {sec:'Notas',   key:'notes',     label:'Observações', type:'textarea'}
];
/* Ordem das seções do formulário. "@" = blocos especiais. */
const FORM_LAYOUT = ['Identificação','@tags','Estoque','Compra','@photos','@maintenance','Notas','@custom','@qr'];
const DEFAULT_ITEM = ()=>({name:'',model:'',brand:'',serial:'',mode:'unit',qty:1,unavailQty:0,status:'disponivel',backOn:'',condition:'bom',location:'',acquiredOn:'',value:'',supplier:'',notes:'',tags:[],custom:[],maintenance:[],holdings:[],photosAt:0,qrEnabled:true});
const PERSIST_KEYS = ITEM_FIELDS.map(f=>f.key).concat(['tags','custom','maintenance','qrEnabled']);

/* =====================================================================
   CAMPOS DO CONTATO — mesma ideia: uma linha nova aqui aparece sozinha
   no formulário, na ficha e é salva.
   ===================================================================== */
const ROLE_SUGGEST = ['Promotor','Produtor','Produtor técnico','Técnico / operador','Cliente','Locatário','Comprador','Fornecedor','Parceiro'];
const CONTACT_FIELDS = [
  {sec:'Identificação', key:'name',     label:'Nome', type:'text', req:true, ph:'Nome da pessoa'},
  {sec:'Identificação', key:'company',  label:'Empresa / produtora', type:'text', suggest:true},
  {sec:'Identificação', key:'cpf',      label:'CPF', type:'text', ph:'000.000.000-00', numeric:true},
  {sec:'Identificação', key:'cnpj',     label:'CNPJ', type:'text', ph:'00.000.000/0000-00', numeric:true},
  {sec:'Contato',       key:'phone',    label:'Telefone / WhatsApp', type:'tel', ph:'(11) 90000-0000'},
  {sec:'Contato',       key:'phone2',   label:'Telefone 2', type:'tel'},
  {sec:'Contato',       key:'email',    label:'E-mail', type:'email'},
  {sec:'Endereço',      key:'cep',      label:'CEP', type:'text', numeric:true},
  {sec:'Endereço',      key:'street',   label:'Rua / avenida', type:'text'},
  {sec:'Endereço',      key:'number',   label:'Número', type:'text'},
  {sec:'Endereço',      key:'complement',label:'Complemento', type:'text'},
  {sec:'Endereço',      key:'district', label:'Bairro', type:'text'},
  {sec:'Endereço',      key:'city',     label:'Cidade', type:'text', suggest:true},
  {sec:'Endereço',      key:'state',    label:'UF', type:'text', ph:'SP'},
  {sec:'Notas',         key:'notes',    label:'Observações', type:'textarea'}
];
const DEFAULT_CONTACT = ()=>Object.assign({roles:[]},Object.fromEntries(CONTACT_FIELDS.map(f=>[f.key,''])));
const contactAddress = c=>[[c.street,c.number].filter(Boolean).join(', '),c.complement,c.district,[c.city,c.state].filter(Boolean).join(' - '),c.cep].filter(Boolean).join(' · ');

/* ---------- estado ---------- */
const S = {
  items:[], all:[], sold:[], events:[], contacts:[], contactsById:new Map(), itemsById:new Map(), meta:{},
  loaded:{items:false,events:false,contacts:false}, contactsError:null,
  tab:'geral', createDraft:null, photoCache:new Map(),
  sync:{fromCache:true,pending:false,online:navigator.onLine},
  ui:{scope:'auto', date:todayISO(), end:'', month:todayISO().slice(0,7), need:{}, q:'', cstatus:'all', csort:'name', ctag:'all', cview:'group', evFilter:'ativos', evq:'', cq:'', crole:'all'},
  user:null, renderPending:false, pendingItem:null
};
(function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('vrm_prefs'))||{};['scope','cview','evFilter','csort'].forEach(k=>{if(p[k])S.ui[k]=p[k];});}catch(e){}})();
const savePrefs = ()=>{try{const u=S.ui;localStorage.setItem('vrm_prefs',JSON.stringify({scope:u.scope,cview:u.cview,evFilter:u.evFilter,csort:u.csort}));}catch(e){}};

/* ---------- Firebase ---------- */
let db=null, auth=null, fbError=null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  if(REQUIRE_LOGIN) auth = firebase.auth();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
}catch(e){ fbError=e; console.error('Firebase:',e); }

/* ---------- regras de disponibilidade ---------- */
const baseQty = it=>it.mode==='qty'?Math.max(0,Math.floor(num(it.qty))):1;
const holdQty = h=>Math.max(1,Math.floor(num(h.qty))||1);
const soldQty = it=>(it.holdings||[]).reduce((s,h)=>h.kind==='vendido'?s+holdQty(h):s,0);
/* total = o que ainda é seu (o que foi vendido sai do estoque) */
const totalQty = it=>Math.max(0,baseQty(it)-soldQty(it));
const downQty = it=>it.mode==='qty'?Math.min(totalQty(it),Math.max(0,Math.floor(num(it.unavailQty)))):0;
const groupKey = it=>((it.model||'').trim()||(it.name||'').trim()||'Sem nome');
const activeRentals = it=>(it.holdings||[]).filter(h=>h.kind==='alugado'&&!h.returnedOn);
const isOverdue = h=>h.kind==='alugado'&&!h.returnedOn&&!!h.until&&h.until<todayISO();
/* unidades alugadas fora no dia d. Sem data de devolução, ou atrasado: continua fora até dar baixa. */
function rentedOn(it,d){
  let s=0; const t=todayISO();
  for(const h of activeRentals(it)){
    const end=(h.until&&h.until>=t)?h.until:null;
    if((!h.from||d>=h.from)&&(!end||d<=end)) s+=holdQty(h);
  }
  return s;
}
/* unidades utilizáveis no dia d, sem contar aluguéis nem eventos */
function usableBase(it,d){
  const tot=totalQty(it);
  if(it.status==='disponivel') return tot-downQty(it);
  if((it.status==='manutencao'||it.status==='danificado') && it.backOn && d>=it.backOn) return tot-downQty(it);
  return 0;
}
/* unidades que podem ser usadas no dia d (ignorando eventos) */
const usableQty = (it,d)=>Math.max(0,usableBase(it,d)-rentedOn(it,d));
/* quantas unidades do item estão reservadas em eventos no dia d.
   ov = {exclude:eventId, extra:Map, range:[a,b]} simula um rascunho de evento */
function reservedFor(itemId,d,ov){
  let sum=0;
  for(const ev of S.events){
    if(ev.status==='cancelado') continue;
    if(ov && ov.exclude===ev.id) continue;
    if(d>=ev.start && d<=ev.end) sum+=ev._m.get(itemId)||0;
  }
  if(ov && ov.extra && d>=ov.range[0] && d<=ov.range[1]) sum+=ov.extra.get(itemId)||0;
  return sum;
}
function dayStats(items,d,ov){
  let T=0,U=0,L=0,R=0,F=0;
  for(const it of items){
    const tot=totalQty(it), b=usableBase(it,d), rent=Math.min(rentedOn(it,d),b), us=b-rent, used=Math.min(reservedFor(it.id,d,ov),us);
    T+=tot; U+=tot-b; L+=rent; R+=used; F+=us-used;
  }
  return {T,U,L,R,F};
}
/* pior dia do intervalo (o que tem menos itens livres) */
function rangeStats(items,a,b,ov){
  let worst=null;
  for(const d of eachDay(a,b)){const s=dayStats(items,d,ov); if(!worst||s.F<worst.F) worst=s;}
  return worst||{T:0,U:0,L:0,R:0,F:0};
}
function eventConflicts(ev){
  const out=[]; if(ev.status==='cancelado'||ev.end<todayISO()) return out;
  for(const [itemId] of ev._m){
    const it=S.itemsById.get(itemId);
    if(!it){out.push({itemId,missing:true,days:[]});continue;}
    const bad=eachDay(ev.start,ev.end).filter(d=>reservedFor(itemId,d)>usableQty(it,d));
    if(bad.length) out.push({itemId,days:bad});
  }
  return out;
}
const evCount = ev=>(ev.alloc||[]).reduce((s,a)=>s+num(a.qty),0);
function evPhase(ev){const t=todayISO();return ev.end<t?'passado':ev.start>t?'proximo':'andamento';}
const PHASE_LABEL={passado:'Passado',proximo:'Próximo',andamento:'Em andamento'};
function evSummary(ev,max=3){
  const m=new Map();
  for(const a of ev.alloc||[]){const it=S.itemsById.get(a.itemId);const k=it?groupKey(it):'(item removido)';m.set(k,(m.get(k)||0)+num(a.qty));}
  const arr=Array.from(m,([k,n])=>n+'× '+k);
  return arr.length>max?arr.slice(0,max).join(' · ')+' · +'+(arr.length-max):arr.join(' · ');
}

/* ---------- tags / categorias / grupos ---------- */
function tagIndex(){
  const m=new Map();
  for(const it of S.items) for(const t of it.tags||[]){
    const k=t.toLowerCase(); if(!m.has(k)) m.set(k,{name:t,units:0,items:0});
    const e=m.get(k); e.units+=totalQty(it); e.items++;
  }
  return Array.from(m.values()).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
}
function canonTag(t){
  t=String(t||'').trim().replace(/\s+/g,' '); if(!t) return '';
  const f=tagIndex().find(x=>x.name.toLowerCase()===t.toLowerCase()); return f?f.name:t;
}
const hasTag = (it,t)=>(it.tags||[]).some(x=>x.toLowerCase()===String(t).toLowerCase());
function scopeItems(scope){
  if(!scope||scope==='all') return S.items;
  const i=scope.indexOf(':'), t=scope.slice(0,i), k=scope.slice(i+1);
  if(t==='tag') return S.items.filter(it=>hasTag(it,k));
  if(t==='model') return S.items.filter(it=>groupKey(it)===k);
  return S.items;
}
function groupsOf(items){
  const m=new Map();
  for(const it of items){const k=groupKey(it); if(!m.has(k)) m.set(k,[]); m.get(k).push(it);}
  return Array.from(m,([key,list])=>({key,items:list})).sort((a,b)=>a.key.localeCompare(b.key,'pt'));
}
function resolveScope(){
  if(S.ui.scope!=='auto') return S.ui.scope;
  const tags=tagIndex();
  const pref=tags.find(t=>['vr','headset','headsets','oculos','quest'].includes(norm(t.name)));
  if(pref) return 'tag:'+pref.name;
  tags.sort((a,b)=>b.items-a.items);
  return tags.length?'tag:'+tags[0].name:'all';
}
function distinct(key){
  const s=new Set(); for(const it of S.items){const v=(it[key]||'').trim(); if(v) s.add(v);}
  return Array.from(s).sort((a,b)=>a.localeCompare(b,'pt'));
}

/* ---------- normalização de dados vindos do Firestore ---------- */
function normItem(id,d){
  const it=Object.assign(DEFAULT_ITEM(),d||{}); it.id=id;
  if(!Array.isArray(it.tags)) it.tags=[]; if(!Array.isArray(it.custom)) it.custom=[]; if(!Array.isArray(it.maintenance)) it.maintenance=[];
  if(!STATUS.some(s=>s[0]===it.status)) it.status='disponivel';
  if(it.mode!=='qty') it.mode='unit';
  it.holdings=(Array.isArray(it.holdings)?it.holdings:[]).filter(h=>h&&(h.kind==='alugado'||h.kind==='vendido')).map(h=>Object.assign({id:'',contactId:'',qty:1,from:'',until:'',date:'',price:'',note:'',returnedOn:''},h));
  return it;
}
function normEvent(id,d){
  const ev=Object.assign({name:'',client:'',place:'',start:todayISO(),end:todayISO(),status:'planejado',notes:'',alloc:[],contacts:[]},d||{}); ev.id=id;
  if(!Array.isArray(ev.alloc)) ev.alloc=[];
  if(!Array.isArray(ev.contacts)) ev.contacts=[];
  if(!ev.end||ev.end<ev.start) ev.end=ev.start;
  ev._m=new Map(); for(const a of ev.alloc) ev._m.set(a.itemId,(ev._m.get(a.itemId)||0)+num(a.qty));
  return ev;
}

function normContact(id,d){
  const c=Object.assign(DEFAULT_CONTACT(),d||{}); c.id=id;
  if(!Array.isArray(c.roles)) c.roles=[];
  return c;
}
const contactName = id=>{const c=S.contactsById.get(id); return c?c.name:'(contato removido)';};

/* ---------- escrita ---------- */
async function runBatch(build){
  const b=db.batch(); build(b);
  const p=b.commit();
  const r=await Promise.race([p.then(()=>'ok'),sleep(3500).then(()=>'slow')]);
  if(r==='slow') p.catch(handleWriteError);
  return r;
}
function handleWriteError(e){
  console.error(e);
  if(e&&e.code==='permission-denied'){ showRulesHelp(); return; }
  toast('Não foi possível salvar: '+(e&&e.message?e.message:e),'err',5000);
}
const clean = o=>JSON.parse(JSON.stringify(o));

/* =====================================================================
   INFRAESTRUTURA DE INTERFACE: avisos, janelas, imagens, QR, etiquetas
   ===================================================================== */
function toast(msg,kind,ms){
  const t=document.createElement('div'); t.className='toast '+(kind&&kind!=='ok'?kind:''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),ms||2600);
}
const modalStack=[];
function openModal(o){
  const prev=document.activeElement;
  const el=document.createElement('div'); el.className='modal';
  el.innerHTML='<div class="sheet '+(o.cls||'')+'" role="dialog" aria-modal="true"><div class="sheet-head"><h2></h2><button class="btn sm" data-mclose aria-label="Fechar">✕</button></div><div class="sheet-body"></div>'+(o.foot?'<div class="sheet-foot"></div>':'')+'</div>';
  const m={el,body:$('.sheet-body',el),foot:$('.sheet-foot',el),opts:o};
  $('h2',el).textContent=o.title||'';
  m.setTitle=t=>{$('h2',el).textContent=t;};
  m.close=()=>{
    if(!el.isConnected) return;
    el.remove(); const i=modalStack.indexOf(m); if(i>=0) modalStack.splice(i,1);
    document.documentElement.classList.toggle('lock',modalStack.length>0);
    if(o.onClose) o.onClose();
    if(prev&&prev.focus&&prev.isConnected){try{prev.focus();}catch(e){}}
  };
  m.request=async()=>{ if(o.beforeClose && !(await o.beforeClose())) return; m.close(); };
  el.addEventListener('mousedown',e=>{ if(e.target===el && !o.noBackdrop) m.request(); });
  el.addEventListener('click',e=>{ if(e.target.closest('[data-mclose]')) m.request(); });
  if(o.body!=null) m.body.innerHTML=o.body;
  if(typeof o.foot==='string') m.foot.innerHTML=o.foot;
  $('#modal-root').appendChild(el); modalStack.push(m);
  document.documentElement.classList.add('lock');
  return m;
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const v=$('.viewer'); if(v){v.remove();return;}
  const m=modalStack[modalStack.length-1]; if(m) m.request();
});
function confirmBox(msg,{ok='Confirmar',danger=false,title='Confirmar'}={}){
  return new Promise(res=>{
    const m=openModal({title,cls:'small',foot:true,noBackdrop:true,body:'<p class="pre" style="margin:0">'+esc(msg)+'</p>',onClose:()=>res(false)});

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Imagem inválida'));i.src=src;});}
async function compressImage(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const w0=img.naturalWidth,h0=img.naturalHeight,s=Math.min(1,max/Math.max(w0,h0));
    const c=document.createElement('canvas'); c.width=Math.round(w0*s); c.height=Math.round(h0*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  }finally{URL.revokeObjectURL(url);}
}
async function photoFromFile(file){
  let d=await compressImage(file,1100,0.72);
  if(d.length>700000) d=await compressImage(file,800,0.6);
  return d;
}
async function makeThumb(dataUrl){
  const img=await loadImg(dataUrl), s=Math.min(1,160/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.6);
}

/* ---------- QR Code ---------- */
let qrPromise=null;
function loadQrLib(){
  if(window.qrcode) return Promise.resolve();
  if(qrPromise) return qrPromise;
  const urls=['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'];
  qrPromise=(async()=>{
    for(const u of urls){
      try{ await new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);}); if(window.qrcode) return; }catch(e){}
    }
    qrPromise=null; throw new Error('Não foi possível carregar o gerador de QR Code (verifique a internet).');
  })();
  return qrPromise;
}
function baseUrl(){
  const custom=(S.meta.baseUrl||'').trim().split('#')[0];
  if(custom) return custom;
  return location.protocol==='file:'?location.href.split('#')[0]:location.origin+location.pathname;
}
const itemUrl = id=>baseUrl()+'#item='+id;
function qrMatrix(text){
  const qr=window.qrcode(0,'M'); qr.addData(text); qr.make();
  const n=qr.getModuleCount(), rows=[];
  for(let r=0;r<n;r++){const row=[];for(let c=0;c<n;c++)row.push(qr.isDark(r,c));rows.push(row);}
  return rows;
}
function qrSvg(text){
  if(!window.qrcode) return '';
  const m=qrMatrix(text), n=m.length, q=2, size=n+q*2; let d='';
  for(let r=0;r<n;r++){let c=0; while(c<n){ if(m[r][c]){const s=c; while(c<n&&m[r][c]) c++; d+='M'+(s+q)+' '+(r+q)+'h'+(c-s)+'v1h-'+(c-s)+'z';} else c++; }}
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function qrPngBlob(text){
  const m=qrMatrix(text), sc=12, q=3, size=(m.length+q*2)*sc;
  const c=document.createElement('canvas'); c.width=c.height=size;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.fillStyle='#000';
  for(let r=0;r<m.length;r++)for(let k=0;k<m.length;k++) if(m[r][k]) x.fillRect((k+q)*sc,(r+q)*sc,sc,sc);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
async function copyQr(id){
  try{
    if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write) throw new Error('sem suporte');
    await navigator.clipboard.write([new ClipboardItem({'image/png':qrPngBlob(itemUrl(id))})]);
    toast('QR Code copiado');
  }catch(e){ toast('Este navegador não copia imagens. Use "Baixar PNG".','warn',4000); }
}

function asciiBar(F,R,U,T,w){
  if(!T) return '<span class="bo">'+'░'.repeat(w)+'</span>';
  let f=Math.round(F/T*w), r=Math.round(R/T*w), u=Math.round(U/T*w);
  if(F>0&&f===0) f=1; if(R>0&&r===0) r=1; if(U>0&&u===0) u=1;
  let diff=w-(f+r+u);
  while(diff!==0){
    const k=[['f',f],['r',r],['u',u]].sort((a,b)=>b[1]-a[1])[0][0];
    if(diff>0){ if(k==='f')f++; else if(k==='r')r++; else u++; diff--; }
    else { if(k==='f')f--; else if(k==='r')r--; else u--; diff++; }
  }
  return '<span class="bf">'+'█'.repeat(f)+'</span><span class="br">'+'▓'.repeat(r)+'</span><span class="bu">'+'▒'.repeat(u)+'</span>';
}

}

let catsShell=false;
function itemSearchText(it){
  return norm([it.name,it.model,it.brand,it.serial,it.location,it.supplier,it.notes,(it.tags||[]).join(' '),(it.custom||[]).map(c=>c.k+' '+c.v).join(' '),(it.holdings||[]).map(h=>contactName(h.contactId)).join(' ')].join(' '));
}
function filteredItems(){
  const u=S.ui, q=norm(u.q.trim());
  let list=S.items.filter(it=>{
    if(q && !q.split(/\s+/).every(w=>itemSearchText(it).includes(w))) return false;
    if(u.cstatus==='fora'){ if(it.status==='disponivel') return false; }
    else if(u.cstatus!=='all' && it.status!==u.cstatus) return false;
    if(u.ctag==='__rent'){ if(!activeRentals(it).length) return false; }
    else if(u.ctag==='__none'){ if((it.tags||[]).length) return false; }
    else if(u.ctag!=='all' && !hasTag(it,u.ctag)) return false;
    return true;
  });
  const cmp={
    name:(a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}),
    model:(a,b)=>groupKey(a).localeCompare(groupKey(b),'pt')||a.name.localeCompare(b.name,'pt',{numeric:true}),
    recent:(a,b)=>(b.createdAt||0)-(a.createdAt||0),
    status:(a,b)=>STATUS.findIndex(s=>s[0]===a.status)-STATUS.findIndex(s=>s[0]===b.status)||a.name.localeCompare(b.name,'pt',{numeric:true}),
    cond:(a,b)=>(COND_LEVEL[a.condition]||9)-(COND_LEVEL[b.condition]||9)||a.name.localeCompare(b.name,'pt',{numeric:true})
  }[u.csort]||((a,b)=>0);
  return list.sort(cmp);
}
function itemRowHTML(it){
  const s=dayStats([it],todayISO()), rents=activeRentals(it);
  let av;
  if(it.mode==='qty') av='<span class="'+(s.F===0?'bad':'good')+'">'+s.F+'/'+s.T+' livres</span>'+(s.L?'<span class="warn">'+s.L+' alugada(s)</span>':'');
  else av=s.L?'<span class="warn">alugado: '+esc(contactName(rents[0].contactId))+'</span>':s.U?'<span class="warn">indisponível</span>':s.R?'<span class="dim">em evento hoje</span>':'<span class="good">livre</span>';
  return '<button class="irow" data-act="open-item" data-id="'+esc(it.id)+'"><span class="thumb">'+(it.thumb?'<img alt="" src="'+esc(it.thumb)+'">':'▢')+'</span>'+
    '<span class="imain"><b>'+esc(it.name)+'</b><small>'+esc([it.model&&it.model!==it.name?it.model:'',it.serial?'S/N '+it.serial:''].filter(Boolean).join(' · ')||(it.mode==='qty'?'Lote de '+totalQty(it):'—'))+'</small>'+
    ((it.tags||[]).length?'<span class="tagline">'+it.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</span>':'')+'</span>'+
    '<span class="imeta">'+statusBadge(it.status)+condHTML(it.condition)+av+'</span></button>';

function renderHoldList(box,sold){

async function getPhotos(id,force){
  if(!force&&S.photoCache.has(id)) return S.photoCache.get(id);
  const snap=await db.collection(COL.photos).where('itemId','==',id).get();
  const arr=snap.docs.map(d=>({id:d.id,data:d.data().data,ts:d.data().ts||0})).sort((a,b)=>a.ts-b.ts);

function mountItemForm(root,opts){
  const ctx={draft:opts.draft,mode:opts.mode,dirty:false,saving:false,root,opts,uid:Math.random().toString(36).slice(2,6)};
  liveDrafts.set(ctx.draft.id,ctx.draft);
  ctx.render=()=>{ const sc=opts.scroller, top=sc?sc.scrollTop:0; root.innerHTML=formHTML(ctx); if(sc) sc.scrollTop=top; fillQrSlots(root); };
  ctx.renderSec=name=>{ const el=root.querySelector('[data-sec="'+name+'"]'); if(!el){ctx.render();return;} el.outerHTML=sectionHTML(name,ctx); if(name==='@qr') fillQrSlots(root); };
  const role=r=>root.querySelector('[data-role="'+r+'"]');
  const addTags=raw=>{
    const inp=role('tag-in'); if(inp) inp.value='';   /* evita novo "change" durante o redesenho */
    const d=ctx.draft; d.tags=d.tags||[];
    String(raw||'').split(',').forEach(x=>{ const t=canonTag(x); if(t&&!d.tags.some(y=>y.toLowerCase()===t.toLowerCase())&&d.tags.length<12) d.tags.push(t); });
    ctx.dirty=true; ctx.renderSec('@tags'); const i=role('tag-in'); if(i) i.focus();
  };
  root.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.role==='tag-in'){ if(t.value.includes(',')) addTags(t.value); return; }
    if(t.dataset.f){ ctx.draft[t.dataset.f]=t.type==='checkbox'?t.checked:t.value; ctx.dirty=true; }
    else if(t.dataset.c){ const c=ctx.draft.custom[+t.dataset.i]; if(c){c[t.dataset.c]=t.value; ctx.dirty=true;} }
  });
  root.addEventListener('change',async e=>{
    const t=e.target;
    if(t.dataset.f){
      const f=fieldByKey(t.dataset.f); ctx.draft[t.dataset.f]=t.type==='checkbox'?t.checked:t.value; ctx.dirty=true;
      if(t.dataset.f==='qrEnabled') ctx.renderSec('@qr'); else if(f&&f.reflow) ctx.render();
    }else if(t.dataset.role==='tag-in'){ if(t.isConnected&&t.value.trim()) addTags(t.value); }
    else if(t.dataset.role==='photo-in'){ const files=Array.from(t.files||[]); t.value=''; await addPhotos(ctx,files); }
  });
  root.addEventListener('keydown',e=>{
    const t=e.target;
    if(t.dataset&&t.dataset.role==='tag-in'){
      if(e.key==='Enter'){ e.preventDefault(); if(t.value.trim()) addTags(t.value); }
      else if(e.key==='Backspace'&&!t.value&&(ctx.draft.tags||[]).length){ ctx.draft.tags.pop(); ctx.dirty=true; ctx.renderSec('@tags'); const i=role('tag-in'); if(i) i.focus(); }
    }
  });
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]'); if(!b||!root.contains(b)) return;
    const a=b.dataset.act, d=ctx.draft; if(a.indexOf('f-')!==0) return;
    if(a==='f-tag-add') addTags(b.dataset.tag);
    else if(a==='f-tag-rm'){ d.tags=(d.tags||[]).filter(x=>x!==b.dataset.tag); ctx.dirty=true; ctx.renderSec('@tags'); }
    else if(a==='f-photo-rm'){ d._photos.splice(+b.dataset.i,1); ctx.dirty=true; ctx.renderSec('@photos'); }
    else if(a==='f-photo-cover'){ const p=d._photos.splice(+b.dataset.i,1)[0]; d._photos.unshift(p); ctx.dirty=true; ctx.renderSec('@photos'); }
    else if(a==='f-photo-view'){ const p=d._photos[+b.dataset.i]; if(p) openViewer(p.data); }
    else if(a==='f-m-add'){
      const desc=role('m-desc').value.trim(); if(!desc){toast('Descreva o que foi feito','warn');role('m-desc').focus();return;}
      d.maintenance=(d.maintenance||[]).concat([{id:Math.random().toString(36).slice(2,10),date:role('m-date').value||todayISO(),type:role('m-type').value,desc,cost:num(role('m-cost').value)||0,by:role('m-by').value.trim()}]);
      ctx.dirty=true; ctx.renderSec('@maintenance');
    }
    else if(a==='f-m-rm'){ d.maintenance=(d.maintenance||[]).filter(x=>x.id!==b.dataset.mid); ctx.dirty=true; ctx.renderSec('@maintenance'); }
    else if(a==='f-c-add'){ d.custom=(d.custom||[]).concat([{k:'',v:''}]); ctx.dirty=true; ctx.renderSec('@custom'); const ins=root.querySelectorAll('[data-c="k"]'); if(ins.length) ins[ins.length-1].focus(); }
    else if(a==='f-c-rm'){ d.custom.splice(+b.dataset.i,1); ctx.dirty=true; ctx.renderSec('@custom'); }
    else if(a==='f-save') saveItemDraft(ctx,false);
    else if(a==='f-save-again') saveItemDraft(ctx,true);
    else if(a==='f-clear'){ if(!ctx.dirty||await confirmBox('Limpar tudo o que foi preenchido?',{ok:'Limpar',danger:true})){ liveDrafts.delete(d.id); S.createDraft=newDraft(); opts.remount&&opts.remount(); } }
    else if(a==='f-cancel') opts.modal&&opts.modal.request();
    else if(a==='f-delete') deleteItemFlow(ctx);
  });
  ctx.render();
  return ctx;
}
async function addPhotos(ctx,files){
  const d=ctx.draft, room=8-d._photos.length;
  if(room<=0){toast('Limite de 8 fotos por item','warn');return;}
  const list=files.slice(0,room); if(files.length>room) toast('Só cabem 8 fotos: as demais foram ignoradas','warn');
  toast('Processando '+list.length+' foto(s)…','ok',1500);
  for(const f of list){ try{ d._photos.push({id:newId(),data:await photoFromFile(f),isNew:true}); }catch(e){toast('Não consegui ler a foto '+f.name,'err');} }
  ctx.dirty=true; ctx.renderSec('@photos');
}
async function saveItemDraft(ctx,again){
  if(ctx.saving) return;
  const d=ctx.draft, name=String(d.name||'').trim();
  if(!name){ toast('Informe o nome do item','warn'); const i=ctx.root.querySelector('[data-f="name"]'); if(i){i.focus();i.scrollIntoView({block:'center'});} return; }
  const isQty=d.mode==='qty', qty=Math.floor(num(d.qty));
  if(isQty&&qty<1){ toast('A quantidade total deve ser 1 ou mais','warn'); return; }
  if(isQty&&num(d.unavailQty)>qty){ toast('A quantidade indisponível não pode passar do total','warn'); return; }
  const ser=norm(d.serial).trim();
  if(ser){ const dup=S.all.find(x=>x.id!==d.id&&norm(x.serial).trim()===ser); if(dup){ toast('O nº de série já está no item “'+dup.name+'”','warn',4000); return; } }
  if(ctx.mode==='edit'&&!d._photosLoaded){ toast('Aguarde as fotos terminarem de carregar','warn'); return; }
  ctx.saving=true; $$('.actionbar .btn',ctx.root).forEach(b=>b.disabled=true);
  try{
    const now=Date.now(), data={};
    PERSIST_KEYS.forEach(k=>{data[k]=d[k];});
    ITEM_FIELDS.forEach(f=>{ if(f.type==='text'||f.type==='textarea') data[f.key]=String(d[f.key]||'').trim(); });
    data.name=name; data.qty=isQty?qty:1; data.unavailQty=isQty?Math.floor(num(d.unavailQty)):0;
    data.value=String(d.value).trim()===''?'':num(d.value);
    if(data.status==='disponivel'||!(data.status==='manutencao'||data.status==='danificado')) data.backOn='';
    data.tags=(d.tags||[]).slice(); data.maintenance=(d.maintenance||[]).slice();
    data.custom=(d.custom||[]).filter(c=>String(c.k||'').trim()).map(c=>({k:String(c.k).trim(),v:String(c.v||'').trim()}));
    data.qrEnabled=!!d.qrEnabled; data.updatedAt=now; if(ctx.mode==='create') data.createdAt=now;
    const final=d._photos||[], orig=d._orig||[], keep=new Set(final.map(p=>p.id));
    data.photoCount=final.length; data.thumb=final.length?await makeThumb(final[0].data):'';
    const phChanged=final.length!==orig.length||final.some((p,i)=>p.isNew||!orig[i]||orig[i].id!==p.id);
    data.photosAt=phChanged?now:(d.photosAt||0);
    if(JSON.stringify(data).length>200000){ toast('Item grande demais (muitas anotações). Reduza o texto.','err',4000); return; }
    const ref=db.collection(COL.items).doc(d.id);
    await runBatch(b=>{
      b.set(ref,clean(data),{merge:true});
      orig.filter(p=>!keep.has(p.id)).forEach(p=>b.delete(photoRef(p.id)));
      final.forEach((p,i)=>{ if(p.isNew) b.set(photoRef(p.id),{itemId:d.id,data:p.data,ts:i,createdAt:now}); else if(p.ts!==i) b.update(photoRef(p.id),{ts:i}); });
    });
    S.photoCache.set(d.id,final.map((p,i)=>({id:p.id,data:p.data,ts:i})));
    liveDrafts.delete(d.id);
    if(ctx.mode==='edit'){ ctx.dirty=false; toast('Alterações salvas'); ctx.opts.modal.close(); return; }
    toast('Item cadastrado');
    const next=newDraft();
    if(again){
      ['model','brand','mode','qty','unavailQty','status','backOn','condition','location','acquiredOn','value','supplier','notes','qrEnabled','name'].forEach(k=>{next[k]=d[k];});
      next.tags=(d.tags||[]).slice(); next.custom=clone(d.custom||[]);
    }
    S.createDraft=next; ctx.opts.remount&&ctx.opts.remount();
    const sc=ctx.opts.scroller; if(sc) sc.scrollTop=0;
    if(again){ const i=$('#view-cadastrar [data-f="name"]'); if(i){i.focus();i.select();} }
  }catch(e){ handleWriteError(e); }
  finally{ ctx.saving=false; $$('.actionbar .btn',ctx.root).forEach(b=>b.disabled=false); }
}
async function deleteItemFlow(ctx){
  const d=ctx.draft;
  const uses=S.events.filter(ev=>ev._m.has(d.id));
  const msg='Excluir “'+d.name+'” de vez?'+(uses.length?'\n\nEle será removido também de '+uses.length+' evento(s).':'')+'\n\nIsso não pode ser desfeito.';
  if(!await confirmBox(msg,{ok:'Excluir item',danger:true,title:'Excluir item'})) return;
  try{
    let photos=[]; try{ photos=await getPhotos(d.id,true); }catch(e){}
    await runBatch(b=>{
      b.delete(db.collection(COL.items).doc(d.id));
      photos.forEach(p=>b.delete(photoRef(p.id)));
      uses.forEach(ev=>b.update(db.collection(COL.events).doc(ev.id),{alloc:ev.alloc.filter(a=>a.itemId!==d.id),updatedAt:Date.now()}));
    });
    S.photoCache.delete(d.id); liveDrafts.delete(d.id);
    toast('Item excluído'); ctx.dirty=false;
    if(S.detail) S.detail.close();
    ctx.opts.modal.close();
  }catch(e){ handleWriteError(e); }
}

let evShell=false;

  if(evShell) return; evShell=true;

  $('#e-q').value=S.ui.evq;

function evFiltered(){
  const t=todayISO(), q=norm(S.ui.evq.trim()), f=S.ui.evFilter;
  let l=S.events.filter(ev=>!q||norm([ev.name,ev.client,ev.place].join(' ')).includes(q));
  const by={ativos:ev=>ev.status!=='cancelado'&&ev.end>=t,passados:ev=>ev.status!=='cancelado'&&ev.end<t,cancelados:ev=>ev.status==='cancelado',todos:()=>true};
  const counts={}; Object.keys(by).forEach(k=>counts[k]=l.filter(by[k]).length);
  l=l.filter(by[f]||by.ativos);
  l.sort((a,b)=>f==='ativos'?a.start.localeCompare(b.start)||a.name.localeCompare(b.name):b.start.localeCompare(a.start));
  return {list:l,counts};
}
function renderEventos(){

  const {list,counts}=evFiltered();

  $('#e-list').innerHTML=list.length?list.map(evRowHTML).join(''):'<div class="empty"><b>'+(S.events.length?'Nenhum evento neste filtro':'Nenhum evento ainda')+'</b>'+(S.events.length?'Troque o filtro acima.':'Crie o primeiro para reservar equipamentos por data.')+'<br><br><button class="btn pri" data-act="new-event">+ Novo evento</button></div>';
}

/* disponibilidade de um item no período do evento em edição */
function itemAvail(it,a,b,ov){
  let min=Infinity, minUse=Infinity;
  for(const d of eachDay(a,b)){ const us=usableQty(it,d); minUse=Math.min(minUse,us); min=Math.min(min,us-reservedFor(it.id,d,ov)); }
  if(!isFinite(min)) return {free:0,reason:''};
  let reason='';
  if(min<=0){
    if(minUse<=0) reason=label(STATUS,it.status).toLowerCase();
    else { const names=S.events.filter(ev=>ev.status!=='cancelado'&&ev.id!==(ov&&ov.exclude)&&ev._m.has(it.id)&&ev.start<=b&&ev.end>=a).map(ev=>ev.name); reason='em uso: '+(names.slice(0,2).join(', ')||'outro evento')+(names.length>2?'…':''); }
  }
  return {free:Math.max(0,min),reason};
}

   '<div class="sect"><div class="h3" style="margin-top:0">Contatos do evento</div><div id="ev-contacts"></div>'+

  const renderSumInner=()=>{

    const total=draft.alloc.reduce((s,a)=>s+num(a.qty),0);
    box.innerHTML='<div class="h3" style="margin-top:0">Equipamentos do evento · '+total+' un.</div>'+

      (sumRows?'<table class="sumtbl"><tr><th>Modelo</th><th>No evento</th><th>Sobram</th></tr>'+sumRows+'</table><div style="height:10px"></div>':'')+
      (rows.length?rows.map(({a,it})=>{
        const p=pr.get(a.itemId), isQ=it&&it.mode==='qty';

  };
  const renderSum=()=>{ if(ctx.rs) return; ctx.rs=true; try{ renderSumInner(); }finally{ ctx.rs=false; } };   /* evita redesenho repetido durante o blur */

    box.innerHTML='<div class="row"><span class="lbl">Atalho:</span><input type="number" class="qty" min="1" value="1" data-role="qn" aria-label="Quantidade" inputmode="numeric"><span>×</span><select data-role="qm" style="width:auto;max-width:100%;flex:1;min-width:140px" aria-label="Modelo">'+
      groups.map(g=>{ const st=rangeStats(g.items,draft.start,draft.end,ov); return '<option value="'+esc(g.key)+'">'+esc(g.key)+' ('+st.F+' livres)</option>'; }).join('')+
      '</select><button class="btn sm blue" data-e="quick">Adicionar livres</button></div>';
  };
  const renderPick=()=>{
    const box=$('#ev-pick',m.el);

    const opts=S.contacts.filter(c=>!used.has(c.id)).slice().sort((a,b)=>a.name.localeCompare(b.name,'pt'));

  const renderAll=()=>{ renderSum(); renderQuick(); renderPick(); };

  const setAlloc=(itemId,qty)=>{ const a=draft.alloc.find(x=>x.itemId===itemId); if(a) a.qty=qty; else draft.alloc.push({itemId,qty}); ctx.dirty=true; };
  m.body.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.ef){ draft[t.dataset.ef]=t.value; ctx.dirty=true; if(t.dataset.ef==='name') m.setTitle(t.value?'Evento: '+t.value:'Novo evento'); }

      if(t.dataset.ef==='start'&&draft.end<draft.start){ draft.end=draft.start; $('#ev-end',m.el).value=draft.end; }
      if(t.dataset.ef==='end'&&draft.end<draft.start){ toast('O fim não pode ser antes do início','warn'); draft.end=draft.start; t.value=draft.end; }
      if(['start','end','status'].includes(t.dataset.ef)) renderAll();

    else if(t.id==='ev-cpick'){ const o=t.selectedOptions[0]; $('#ev-crole',m.el).placeholder=(o&&o.dataset.role)?o.dataset.role+' (padrão)':'Função no evento (ex.: Promotor)'; }
    else if(t.dataset.eq){ const it=S.itemsById.get(t.dataset.eq); const max=it?totalQty(it):9999; let q=Math.floor(num(t.value)); if(q<1)q=1; if(q>max)q=max; t.value=q; setAlloc(t.dataset.eq,q); renderSum(); renderPick(); renderQuick(); }
  });
  m.el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-e]'); if(!b) return; const a=b.dataset.e;
    if(a==='add'){
      const it=S.itemsById.get(b.dataset.id); if(!it) return;
      const qi=$('[data-pq="'+b.dataset.id+'"]',m.el); let q=qi?Math.floor(num(qi.value)):1; if(q<1) q=1;
      const av=itemAvail(it,draft.start,draft.end,getOv()); if(q>av.free) q=av.free; if(q<1) return;
      setAlloc(it.id,q); renderSum(); renderPick(); renderQuick();
    }else if(a==='rm'){
      draft.alloc=draft.alloc.filter(x=>x.itemId!==b.dataset.id); ctx.dirty=true; renderSum(); renderPick(); renderQuick();

      for(const it of cand){ if(need<=0) break; const f=itemAvail(it,draft.start,draft.end,ov).free; if(f<=0) continue; const take=Math.min(f,need); setAlloc(it.id,take); need-=take; added+=take; }
      if(added===0) toast('Nenhum item livre de “'+key+'” nessas datas','warn',3500);
      else if(need>0) toast('Só havia '+added+' livre(s): faltam '+need,'warn',4000);

    }else if(a==='cadd'){
      const sel=$('#ev-cpick',m.el); if(!sel.value){ toast('Escolha um contato (ou crie um novo)','warn'); return; }
      const role=$('#ev-crole',m.el).value.trim()||sel.selectedOptions[0].dataset.role||'';

    }else if(a==='cnew'){
      openContact(null,{onSaved:(cid,data)=>{ ctx.tmpC.set(cid,data); if(!draft.contacts.some(c=>c.contactId===cid)){ draft.contacts.push({contactId:cid,role:$('#ev-crole',m.el).value.trim()||(data.roles||[])[0]||''}); ctx.dirty=true; } renderContacts(); setTimeout(renderContacts,250); }});
    }else if(a==='save') saveEvent();
    else if(a==='del'){
      if(!await confirmBox('Excluir o evento “'+draft.name+'”?\nOs equipamentos voltam a ficar livres nessas datas.',{ok:'Excluir evento',danger:true,title:'Excluir evento'})) return;
      try{ await runBatch(bt=>bt.delete(db.collection(COL.events).doc(draft.id))); ctx.dirty=false; toast('Evento excluído'); m.close(); }catch(err){handleWriteError(err);}
    }
  });
  async function saveEvent(){
    if(ctx.saving) return;
    const name=String(draft.name||'').trim();
    if(!name){ toast('Informe o nome do evento','warn'); $('#ev-name',m.el).focus(); return; }
    if(!validDates()){ toast('Confira as datas: o fim deve ser igual ou depois do início','warn'); return; }
    const pr=problems(getOv());
    if(pr.size && !await confirmBox(pr.size+' equipamento(s) estão indisponíveis ou reservados em duplicidade nessas datas.\nSalvar mesmo assim?',{ok:'Salvar mesmo assim',title:'Conflito de equipamentos'})) return;
    ctx.saving=true; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=true);
    try{
      const now=Date.now();
      const data={name,client:String(draft.client||'').trim(),place:String(draft.place||'').trim(),start:draft.start,end:draft.end,status:draft.status,notes:String(draft.notes||'').trim(),
        alloc:draft.alloc.filter(a=>num(a.qty)>0).map(a=>({itemId:a.itemId,qty:Math.floor(num(a.qty))})),
        contacts:draft.contacts.filter(c=>c.contactId).map(c=>({contactId:c.contactId,role:String(c.role||'').trim()})),updatedAt:now};
      if(isNew) data.createdAt=now;
      await runBatch(bt=>bt.set(db.collection(COL.events).doc(draft.id),data,{merge:true}));
      ctx.dirty=false; toast(isNew?'Evento criado':'Evento salvo'); m.close();
    }catch(err){ handleWriteError(err); ctx.saving=false; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=false); }
  }
  setTimeout(()=>{ if(isNew){ const i=$('#ev-name',m.el); if(i&&!matchMedia('(pointer:coarse)').matches) i.focus(); } },50);
}

let ctShell=false;
const initials = n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const digits = s=>String(s||'').replace(/\D/g,'');
function contactRecs(id){ const out=[]; for(const it of S.all) for(const h of it.holdings||[]) if(h.contactId===id) out.push({it,h}); return out; }
function contactSearchText(c){
  return norm([c.name,c.company,c.cpf,digits(c.cpf),c.cnpj,digits(c.cnpj),c.phone,digits(c.phone),c.phone2,c.email,c.city,c.district,c.notes,(c.roles||[]).join(' ')].join(' '));
}
function ensureCtShell(){
  if(ctShell) return; ctShell=true;
  $('#view-contatos').innerHTML='<div class="card"><div class="toolbar"><div class="grow1"><input type="search" id="ct-q" placeholder="Buscar nome, empresa, telefone, CPF…" aria-label="Buscar contato"></div><button class="btn pri" data-act="new-contact">+ Novo contato</button></div><div class="chips" id="ct-chips"></div></div><div class="card" style="margin-top:14px" id="ct-list"></div>';
  $('#ct-q').value=S.ui.cq;
}
function renderContatos(){
  ensureCtShell();
  const box=$('#ct-list');
  if(S.contactsError){ box.innerHTML='<div class="empty"><b class="bad">Não foi possível ler os contatos</b>'+(S.contactsError==='permission-denied'?'Falta liberar a coleção <code>vrm_contacts</code> nas regras do Firebase.<br><br><button class="btn pri" data-act="rules">Ver como liberar</button>':'Erro: '+esc(S.contactsError))+'</div>'; $('#ct-chips').innerHTML=''; return; }
  if(!S.loaded.contacts){ box.innerHTML='<div class="empty"><b>Carregando…</b></div>'; return; }
  const withEq=S.contacts.filter(c=>contactRecs(c.id).some(r=>r.h.kind==='alugado'&&!r.h.returnedOn));
  const roles=new Map(); S.contacts.forEach(c=>(c.roles||[]).forEach(r=>{const k=r.toLowerCase(); if(!roles.has(k)) roles.set(k,{name:r,n:0}); roles.get(k).n++;}));
  const rl=Array.from(roles.values()).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  if(S.ui.crole!=='all'&&S.ui.crole!=='__equip'&&!roles.has(S.ui.crole.toLowerCase())) S.ui.crole='all';
  $('#ct-chips').innerHTML='<button class="chip'+(S.ui.crole==='all'?' on':'')+'" data-act="ct-role" data-role="all">Todos<span class="n">'+S.contacts.length+'</span></button>'+
    rl.map(r=>'<button class="chip'+(S.ui.crole.toLowerCase()===r.name.toLowerCase()?' on':'')+'" data-act="ct-role" data-role="'+esc(r.name)+'">'+esc(r.name)+'<span class="n">'+r.n+'</span></button>').join('')+
    '<button class="chip sp'+(S.ui.crole==='__equip'?' on':'')+'" data-act="ct-role" data-role="__equip">Com equipamento<span class="n">'+withEq.length+'</span></button>';
  if(!S.contacts.length){ box.innerHTML='<div class="empty"><b>Nenhum contato ainda</b>Cadastre promotores, produtores técnicos, clientes… e ligue-os a eventos e a equipamentos alugados ou vendidos.<br><br><button class="btn pri" data-act="new-contact">+ Novo contato</button></div>'; return; }
  const q=norm(S.ui.cq.trim());
  const list=S.contacts.filter(c=>{
    if(q&&!q.split(/\s+/).every(w=>contactSearchText(c).includes(w))) return false;
    if(S.ui.crole==='__equip') return withEq.includes(c);
    if(S.ui.crole!=='all') return (c.roles||[]).some(r=>r.toLowerCase()===S.ui.crole.toLowerCase());
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  if(!list.length){ box.innerHTML='<div class="empty"><b>Nenhum contato encontrado</b>Ajuste a busca ou o filtro.</div>'; return; }
  box.innerHTML='<div class="dim" style="font-size:12px;margin-bottom:8px">'+list.length+' contato(s)</div>'+list.map(c=>{
    const recs=contactRecs(c.id), out=recs.filter(r=>r.h.kind==='alugado'&&!r.h.returnedOn), bought=recs.filter(r=>r.h.kind==='vendido');
    const outN=out.reduce((s,r)=>s+holdQty(r.h),0), boughtN=bought.reduce((s,r)=>s+holdQty(r.h),0), late=out.some(r=>isOverdue(r.h));
    return '<button class="irow" data-act="open-contact" data-id="'+esc(c.id)+'"><span class="thumb ini">'+esc(initials(c.name))+'</span>'+
      '<span class="imain"><b>'+esc(c.name)+'</b><small>'+esc([c.company,c.phone].filter(Boolean).join(' · ')||'—')+'</small>'+((c.roles||[]).length?'<span class="tagline">'+c.roles.map(r=>'<span class="tag">'+esc(r)+'</span>').join('')+'</span>':'')+'</span>'+
      '<span class="imeta">'+(outN?'<span class="badge '+(late?'st-cancelado':'st-alugado')+'">'+outN+' alugado(s)'+(late?' · atrasado':'')+'</span>':'')+(boughtN?'<span class="badge st-vendido">'+boughtN+' comprado(s)</span>':'')+'</span></button>';
  }).join('');
}

/* ---------- formulário do contato ---------- */
function openContact(id,opts){
  opts=opts||{};
  if(!db){ toast('Firebase indisponível','err'); return; }
  const src=id?S.contactsById.get(id):null;
  if(id&&!src){ toast('Contato não encontrado','warn'); return; }
  const draft=src?clone(src):DEFAULT_CONTACT(); draft.id=src?src.id:db.collection(COL.contacts).doc().id;
  const isNew=!src, ctx={dirty:false,saving:false}, uid=Math.random().toString(36).slice(2,6);
  const m=openModal({title:isNew?'Novo contato':'Editar: '+draft.name,cls:'wide',foot:true,noBackdrop:true,body:'',
    beforeClose:async()=>!ctx.dirty||await confirmBox('Descartar as alterações deste contato?',{ok:'Descartar',danger:true})});
  m.foot.innerHTML=(isNew?'':'<button class="btn danger" data-k="del" style="margin-right:auto">Excluir</button>')+'<button class="btn" data-mclose>Cancelar</button><button class="btn pri" data-k="save">Salvar contato</button>';
  const secs=[]; CONTACT_FIELDS.forEach(f=>{ if(!secs.includes(f.sec)) secs.push(f.sec); });
  const cf=f=>{
    const idf='cf-'+uid+'-'+f.key; let input;
    if(f.type==='textarea') input='<textarea id="'+idf+'" data-cf="'+f.key+'"></textarea>';
    else input='<input type="'+f.type+'" id="'+idf+'" data-cf="'+f.key+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off"'+(f.suggest?' list="dl-'+uid+'-'+f.key+'"':'')+(f.numeric?' inputmode="numeric"':'')+'>';
    return '<div class="field'+(f.type==='textarea'?' full':'')+'"><label for="'+idf+'">'+esc(f.label)+(f.req?' *':'')+'</label>'+input+'</div>';
  };
  const dls=CONTACT_FIELDS.filter(f=>f.suggest).map(f=>{ const s=new Set(S.contacts.map(c=>(c[f.key]||'').trim()).filter(Boolean)); return '<datalist id="dl-'+uid+'-'+f.key+'">'+Array.from(s).sort().map(v=>'<option value="'+esc(v)+'"></option>').join('')+'</datalist>'; }).join('');
  m.body.innerHTML=dls+secs.map((s,i)=>'<div class="sect"><div class="h3">'+esc(s)+'</div><div class="fgrid">'+CONTACT_FIELDS.filter(f=>f.sec===s).map(cf).join('')+'</div></div>'+(i===0?'<div class="sect" id="ct-roles"></div>':'')).join('');
  CONTACT_FIELDS.forEach(f=>{ const el=$('[data-cf="'+f.key+'"]',m.body); if(el) el.value=draft[f.key]||''; });
  const allRoles=()=>{ const s=new Map(); ROLE_SUGGEST.forEach(r=>s.set(r.toLowerCase(),r)); S.contacts.forEach(c=>(c.roles||[]).forEach(r=>{ if(!s.has(r.toLowerCase())) s.set(r.toLowerCase(),r); })); return Array.from(s.values()); };
  const renderRoles=()=>{
    const used=new Set(draft.roles.map(r=>r.toLowerCase()));
    $('#ct-roles',m.el).innerHTML='<div class="h3">Funções</div><div class="tagsin">'+draft.roles.map(r=>'<span class="tag rm" data-k="rrm" data-r="'+esc(r)+'" title="Remover">'+esc(r)+' ✕</span>').join('')+
      '<input type="text" data-role="role-in" placeholder="'+(draft.roles.length?'Outra função…':'Ex.: Promotor, Produtor técnico (Enter)')+'" enterkeyhint="done" autocomplete="off" aria-label="Adicionar função"></div>'+
      '<div class="chips" style="margin-top:8px">'+allRoles().filter(r=>!used.has(r.toLowerCase())).map(r=>'<button type="button" class="chip" data-k="radd" data-r="'+esc(r)+'">+ '+esc(r)+'</button>').join('')+'</div>';
  };
  const addRole=raw=>{
    const inp=$('[data-role="role-in"]',m.el); if(inp) inp.value='';
    String(raw||'').split(',').forEach(x=>{ const t=x.trim().replace(/\s+/g,' '); if(t&&!draft.roles.some(y=>y.toLowerCase()===t.toLowerCase())&&draft.roles.length<10){ const known=allRoles().find(k=>k.toLowerCase()===t.toLowerCase()); draft.roles.push(known||t); } });
    ctx.dirty=true; renderRoles(); const i=$('[data-role="role-in"]',m.el); if(i) i.focus();
  };
  renderRoles();
  m.body.addEventListener('input',e=>{ const t=e.target; if(t.dataset.cf){ draft[t.dataset.cf]=t.value; ctx.dirty=true; if(t.dataset.cf==='name') m.setTitle(t.value?(isNew?'Novo: ':'Editar: ')+t.value:(isNew?'Novo contato':'Editar contato')); } else if(t.dataset.role==='role-in'&&t.value.includes(',')) addRole(t.value); });
  m.body.addEventListener('change',e=>{ const t=e.target; if(t.dataset.role==='role-in'&&t.isConnected&&t.value.trim()) addRole(t.value); });
  m.body.addEventListener('keydown',e=>{ const t=e.target; if(t.dataset&&t.dataset.role==='role-in'){ if(e.key==='Enter'){ e.preventDefault(); if(t.value.trim()) addRole(t.value); } else if(e.key==='Backspace'&&!t.value&&draft.roles.length){ draft.roles.pop(); ctx.dirty=true; renderRoles(); const i=$('[data-role="role-in"]',m.el); if(i) i.focus(); } } });
  m.el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
    if(k==='radd') addRole(b.dataset.r);
    else if(k==='rrm'){ draft.roles=draft.roles.filter(r=>r!==b.dataset.r); ctx.dirty=true; renderRoles(); }
    else if(k==='save') save();
    else if(k==='del') del();
  });
  async function save(){
    if(ctx.saving) return;
    const name=String(draft.name||'').trim();
    if(!name){ toast('Informe o nome do contato','warn'); const i=$('[data-cf="name"]',m.el); if(i){i.focus();i.scrollIntoView({block:'center'});} return; }
    const cpf=digits(draft.cpf);
    if(cpf){ const dup=S.contacts.find(c=>c.id!==draft.id&&digits(c.cpf)===cpf); if(dup&&!await confirmBox('O CPF já está no contato “'+dup.name+'”.\nSalvar mesmo assim?',{ok:'Salvar mesmo assim',title:'CPF repetido'})) return; }
    ctx.saving=true; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=true);
    try{
      const now=Date.now(), data={};
      CONTACT_FIELDS.forEach(f=>{ data[f.key]=String(draft[f.key]||'').trim(); });
      data.name=name; data.roles=draft.roles.slice(); data.updatedAt=now; if(isNew) data.createdAt=now;
      await runBatch(bt=>bt.set(db.collection(COL.contacts).doc(draft.id),clean(data),{merge:true}));
      ctx.dirty=false; toast(isNew?'Contato criado':'Contato salvo'); m.close();
      if(opts.onSaved) opts.onSaved(draft.id,data);
    }catch(err){ handleWriteError(err); ctx.saving=false; $$('.sheet-foot .btn',m.el).forEach(x=>x.disabled=false); }
  }
  async function del(){
    const recs=contactRecs(draft.id), evs=S.events.filter(ev=>(ev.contacts||[]).some(c=>c.contactId===draft.id));
    const msg='Excluir “'+draft.name+'”?'+(evs.length?'\n\nEle será tirado de '+evs.length+' evento(s).':'')+(recs.length?'\n\nHá '+recs.length+' registro(s) de aluguel/venda ligados a ele; o histórico ficará como “(contato removido)”.':'')+'\n\nIsso não pode ser desfeito.';
    if(!await confirmBox(msg,{ok:'Excluir contato',danger:true,title:'Excluir contato'})) return;
    try{
      await runBatch(bt=>{ bt.delete(db.collection(COL.contacts).doc(draft.id)); evs.forEach(ev=>bt.update(db.collection(COL.events).doc(ev.id),{contacts:ev.contacts.filter(c=>c.contactId!==draft.id),updatedAt:Date.now()})); });
      ctx.dirty=false; toast('Contato excluído'); m.close(); if(S.cdetail) S.cdetail.close();
    }catch(err){ handleWriteError(err); }
  }
  setTimeout(()=>{ if(isNew&&!matchMedia('(pointer:coarse)').matches){ const i=$('[data-cf="name"]',m.el); if(i) i.focus(); } },50);
}

  const addr=contactAddress(c), ph=digits(c.phone), wa=ph?(ph.length<=11?'55'+ph:ph):'';

  const recs=contactRecs(c.id), rank=r=>(r.h.kind==='alugado'&&!r.h.returnedOn)?0:1;
  const now=recs.filter(r=>rank(r)===0).sort((a,b)=>(a.h.until||'9999').localeCompare(b.h.until||'9999'));
  const hist=recs.filter(r=>rank(r)===1).sort((a,b)=>(b.h.returnedOn||b.h.date||b.h.from||'').localeCompare(a.h.returnedOn||a.h.date||a.h.from||''));
  const row=({it,h})=>{
    const sold=h.kind==='vendido', active=!sold&&!h.returnedOn, late=isOverdue(h);

    const info=[sold?(h.date?fmtDate(h.date):''):rentLine(h),h.returnedOn?'devolvido em '+fmtDate(h.returnedOn):'',(h.price!==''&&h.price!=null&&num(h.price))?money(h.price):'',h.note||''].filter(Boolean).join(' · ');
    const ids=' data-item="'+esc(it.id)+'" data-hid="'+esc(h.id)+'"';
    const acts=active?'<button class="btn sm" data-act="h-return"'+ids+'>Devolvido</button><button class="btn sm ghost" data-act="h-extend"'+ids+'>Prazo</button><button class="btn sm danger" data-act="h-del"'+ids+' aria-label="Remover registro">✕</button>':'<button class="btn sm danger" data-act="h-del"'+ids+'>'+(sold?'Desfazer venda':'✕')+'</button>';
    return '<div class="mrow"><div style="min-width:0">'+title+' <button type="button" class="linkbtn" data-act="open-item" data-id="'+esc(it.id)+'">'+(holdQty(h)>1?holdQty(h)+'× ':'')+esc(it.name)+'</button><br><small class="dim">'+esc([it.model&&it.model!==it.name?it.model:'',info].filter(Boolean).join(' · '))+'</small></div><div class="row" style="flex:none;justify-content:flex-end">'+acts+'</div></div>';
  };
  const evs=S.events.filter(ev=>(ev.contacts||[]).some(x=>x.contactId===c.id)).sort((a,b)=>b.start.localeCompare(a.start));
  m.body.innerHTML=
    ((c.roles||[]).length?'<div class="tagline" style="margin-bottom:10px">'+c.roles.map(r=>'<span class="tag">'+esc(r)+'</span>').join('')+'</div>':'')+
    (links?'<div class="row" style="margin-bottom:12px">'+links+'</div>':'')+
    (kv?'<div class="kv">'+kv+'</div>':'<div class="dim">Sem dados de contato preenchidos.</div>')+
    (c.notes?'<div class="h3">Observações</div><div class="pre">'+esc(c.notes)+'</div>':'')+
    '<div class="h3">Equipamentos com este contato'+(now.length?' · '+now.reduce((s,r)=>s+holdQty(r.h),0)+' un.':'')+'</div>'+
    '<div class="row" style="margin-bottom:8px"><button class="btn sm blue" data-act="cv-move" data-kind="alugado">+ Alugar</button><button class="btn sm blue" data-act="cv-move" data-kind="vendido">+ Vender</button></div>'+

  m.body.scrollTop=top;
}

/* ---------- registro: devolver / prazo / remover ---------- */
async function updateHoldings(itemId,fn){
  const it=S.itemsById.get(itemId); if(!it) return false;
  const hs=clone(it.holdings||[]); fn(hs);
  try{ await runBatch(b=>b.update(db.collection(COL.items).doc(itemId),{holdings:clean(hs),updatedAt:Date.now()})); return true; }
  catch(e){ handleWriteError(e); return false; }
}
async function holdingAction(a,itemId,hid){
  const it=S.itemsById.get(itemId), h=it&&(it.holdings||[]).find(x=>x.id===hid); if(!h){ toast('Registro não encontrado','warn'); return; }
  if(a==='h-return'){
    if(!await confirmBox('Registrar a devolução de “'+it.name+'” hoje ('+fmtDate(todayISO())+')?\nEle volta a ficar disponível.',{ok:'Registrar devolução',title:'Devolução'})) return;
    if(await updateHoldings(itemId,hs=>{ hs.find(x=>x.id===hid).returnedOn=todayISO(); })) toast('Devolução registrada');
  }else if(a==='h-del'){
    const sold=h.kind==='vendido';
    if(!await confirmBox(sold?'Desfazer a venda de “'+it.name+'”?\nO item volta para o estoque.':'Remover este registro de aluguel de “'+it.name+'”?',{ok:sold?'Desfazer venda':'Remover',danger:true,title:sold?'Desfazer venda':'Remover registro'})) return;
    if(await updateHoldings(itemId,hs=>{ hs.splice(hs.findIndex(x=>x.id===hid),1); })) toast(sold?'Venda desfeita':'Registro removido');
  }else if(a==='h-extend'){
    const m=openModal({title:'Prazo de devolução',cls:'small',foot:true,body:'<div class="field"><label for="x-until">Devolução prevista</label><input type="date" id="x-until"></div><p class="dim" style="font-size:12px;margin-bottom:0">Deixe em branco para “sem prazo definido”.</p>'});
    $('#x-until',m.el).value=h.until||'';
    m.foot.innerHTML='<button class="btn" data-mclose>Cancelar</button><button class="btn pri" data-x="ok">Salvar</button>';
    m.el.addEventListener('click',async e=>{ if(!e.target.closest('[data-x="ok"]')) return; const v=$('#x-until',m.el).value;
      if(v&&h.from&&v<h.from){ toast('A devolução não pode ser antes do início','warn'); return; }

  }
}

/* ---------- Alugar / Vender ---------- */
function openMove(opts){

  const st={kind:opts.kind==='vendido'?'vendido':'alugado',contactId:opts.contactId||'',from:todayISO(),until:'',date:todayISO(),unit:'',note:'',sel:new Map(),q:'',tag:'all',tmpC:new Map(),saving:false};
  if(opts.itemId&&S.itemsById.has(opts.itemId)) st.sel.set(opts.itemId,1);
  const m=openModal({title:'',cls:'wide',foot:true,noBackdrop:true,body:''});

   '<div class="sect"><div class="row" style="margin-bottom:10px"><button type="button" class="chip" data-v="kind" data-kind="alugado">Alugar</button><button type="button" class="chip" data-v="kind" data-kind="vendido">Vender</button></div>'+
