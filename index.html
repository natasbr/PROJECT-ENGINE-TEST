<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VR Fleet & Inventory Manager</title>
  <meta name="description" content="Gerenciador de frotas de Realidade Virtual e equipamentos para GitHub Pages" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js CDN for standalone labels -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans antialiased selection:bg-cyan-500 selection:text-white">
  <div id="app-container" class="flex-1 flex flex-col max-w-7xl w-full mx-auto p-3 sm:p-6 pb-20">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-2">
          <span class="p-2 bg-cyan-500/20 text-cyan-400 rounded-lg border border-cyan-500/30">🥽</span>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">VR Fleet Manager</h1>
        </div>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Gestão de Headsets VR, Baterias, Cabos e Agendamento de Eventos</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="sync-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Pronto para GitHub Pages
        </span>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex border-b border-slate-800 mt-4 overflow-x-auto no-scrollbar gap-1 sm:gap-2">
      <button onclick="switchTab('general')" id="tab-btn-general" class="tab-btn px-4 py-3 text-sm font-semibold text-cyan-400 border-b-2 border-cyan-400 whitespace-nowrap">
        📊 Visão Geral
      </button>
      <button onclick="switchTab('register')" id="tab-btn-register" class="tab-btn px-4 py-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent whitespace-nowrap">
        ➕ Cadastrar Item
      </button>
      <button onclick="switchTab('categories')" id="tab-btn-categories" class="tab-btn px-4 py-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent whitespace-nowrap">
        📦 Categorias & Estoque
      </button>
      <button onclick="switchTab('events')" id="tab-btn-events" class="tab-btn px-4 py-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent whitespace-nowrap">
        📅 Eventos & Alocação
      </button>
    </nav>

    <!-- Content Sections -->
    <main class="mt-6 flex-1">
      <div id="view-content"></div>
    </main>
  </div>

  <!-- Print Area (hidden on screen, active on print) -->
  <div id="print-area" class="hidden"></div>

  <script>
    // Initial data injected from app state
    let items = [];
    let events = [];
    let fbConfig = null;
    let currentTab = 'general';
    let db = null;

    // Save to localStorage
    function persist() {
      localStorage.setItem('vr_fleet_items_data', JSON.stringify(items));
      localStorage.setItem('vr_fleet_events_data', JSON.stringify(events));
      renderCurrentView();
    }

    function initFirebaseIfPossible() {
      if (fbConfig && fbConfig.apiKey && fbConfig.projectId && window.firebase) {
        try {
          if (!firebase.apps.length) {
            firebase.initializeApp(fbConfig);
          }
          db = firebase.firestore();
          // Real-time listener
          db.collection('vr_fleet_management_items').onSnapshot(snap => {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            if (list.length > 0) {
              items = list;
              persist();
            }
          });
          db.collection('vr_fleet_management_events').onSnapshot(snap => {
            const list = [];
            snap.forEach(d => list.push(d.data()));
            if (list.length > 0) {
              events = list;
              persist();
            }
          });
          document.getElementById('sync-badge').innerHTML = '<span class="w-2 h-2 rounded-full bg-cyan-400"></span> Firebase Nuvem Conectado';
        } catch(e) {
          console.error(e);
        }
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn px-4 py-3 text-sm font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent whitespace-nowrap';
      });
      const activeBtn = document.getElementById('tab-btn-' + tab);
      if (activeBtn) {
        activeBtn.className = 'tab-btn px-4 py-3 text-sm font-semibold text-cyan-400 border-b-2 border-cyan-400 whitespace-nowrap';
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('view-content');
      if (currentTab === 'general') renderGeneral(container);
      else if (currentTab === 'register') renderRegister(container);
      else if (currentTab === 'categories') renderCategories(container);
      else if (currentTab === 'events') renderEvents(container);
      lucide.createIcons();
    }

    // Helper: calculate headsets available on specific date
    function getAvailabilityForDate(dateStr) {
      const targetDate = dateStr ? new Date(dateStr) : new Date();
      targetDate.setHours(12, 0, 0, 0);

      const headsets = items.filter(i => i.isHeadset);
      const totalHeadsets = headsets.length;
      
      const maintenanceHeadsets = headsets.filter(h => h.condition === 'manutencao' || h.condition === 'aposentado').length;

      // Find events that overlap with this date
      const activeEventsOnDate = events.filter(e => {
        if (e.status === 'cancelado') return false;
        const start = new Date(e.startDate);
        const end = new Date(e.endDate || e.startDate);
        start.setHours(0, 0, 0, 0);
        end.setHours(23, 59, 59, 999);
        return targetDate >= start && targetDate <= end;
      });

      const allocatedHeadsetIds = new Set();
      activeEventsOnDate.forEach(ev => {
        (ev.allocatedItemIds || []).forEach(id => {
          const item = items.find(it => it.id === id);
          if (item && item.isHeadset) allocatedHeadsetIds.add(id);
        });
      });

      const inUseCount = allocatedHeadsetIds.size;
      const availableCount = Math.max(0, totalHeadsets - inUseCount - maintenanceHeadsets);

      return {
        totalHeadsets,
        availableCount,
        inUseCount,
        maintenanceHeadsets,
        activeEventsOnDate
      };
    }

    function renderGeneral(container) {
      const todayStr = new Date().toISOString().split('T')[0];
      const selectedDate = window.selectedCheckDate || todayStr;
      const stats = getAvailabilityForDate(selectedDate);
      const totalItems = items.length;
      const batteries = items.filter(i => i.tags && i.tags.some(t => t.toLowerCase().includes('bateria') || t.toLowerCase().includes('bobovr'))).length;

      container.innerHTML = `
        <div class="space-y-6">
          <!-- Quick Status Cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
              <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Total Headsets VR</span>
              <div class="text-2xl sm:text-3xl font-bold text-white mt-1">${stats.totalHeadsets}</div>
              <span class="text-xs text-slate-500 mt-1 block">Meta Quest 2, 3 e outros</span>
            </div>
            <div class="bg-slate-900 border border-emerald-500/30 rounded-xl p-4 sm:p-5 bg-gradient-to-b from-emerald-500/5 to-transparent">
              <span class="text-xs text-emerald-400 font-medium uppercase tracking-wider">Livres na Data</span>
              <div class="text-2xl sm:text-3xl font-bold text-emerald-400 mt-1">${stats.availableCount}</div>
              <span class="text-xs text-slate-400 mt-1 block">${stats.totalHeadsets > 0 ? Math.round((stats.availableCount/stats.totalHeadsets)*100) : 0}% disponíveis</span>
            </div>
            <div class="bg-slate-900 border border-amber-500/30 rounded-xl p-4 sm:p-5">
              <span class="text-xs text-amber-400 font-medium uppercase tracking-wider">Alocados / Em Evento</span>
              <div class="text-2xl sm:text-3xl font-bold text-amber-400 mt-1">${stats.inUseCount}</div>
              <span class="text-xs text-slate-400 mt-1 block">Em uso na data escolhida</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-5">
              <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Baterias & Acessórios</span>
              <div class="text-2xl sm:text-3xl font-bold text-cyan-400 mt-1">${batteries}</div>
              <span class="text-xs text-slate-500 mt-1 block">BoboVR e itens cadastrados</span>
            </div>
          </div>

          <!-- Date Availability Checker Widget -->
          <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
              <div>
                <h3 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                  <span>📅</span> Checador Inteligente de Disponibilidade por Data
                </h3>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">
                  Consulte qualquer data futura para saber se você possui headsets suficientes para marcar outro evento.
                </p>
              </div>
              <div class="flex items-center gap-2">
                <label class="text-xs text-slate-400 font-medium">Data Alvo:</label>
                <input type="date" id="date-picker-input" value="${selectedDate}" onchange="window.selectedCheckDate = this.value; renderCurrentView();" class="bg-slate-950 border border-slate-700 text-white rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-cyan-500" />
              </div>
            </div>

            <div class="mt-4 p-4 rounded-xl border ${stats.availableCount > 0 ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-rose-950/20 border-rose-500/30'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <span class="text-xs uppercase font-semibold ${stats.availableCount > 0 ? 'text-emerald-400' : 'text-rose-400'}">
                  ${stats.availableCount > 0 ? '✓ Disponibilidade Confirmada' : '⚠️ Atenção: Capacidade Esgotada'}
                </span>
                <p class="text-sm text-slate-200 mt-0.5 font-medium">
                  Em <strong>${new Date(selectedDate + 'T12:00:00').toLocaleDateString('pt-BR')}</strong>: você possui 
                  <strong class="text-cyan-400">${stats.availableCount}</strong> headsets livres de um total de <strong>${stats.totalHeadsets}</strong>.
                </p>
              </div>
              <button onclick="switchTab('events')" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-xs rounded-lg transition">
                + Agendar Evento Nesta Data
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderRegister(container) {
      container.innerHTML = `
        <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-8 shadow-xl">
          <h2 class="text-xl font-bold text-white mb-1">Cadastrar Novo Equipamento</h2>
          <p class="text-sm text-slate-400 mb-6">Cadastre headsets, baterias BoboVR, cabos, PCs ou materiais com geração automática de etiqueta QR Code.</p>
          
          <form id="item-form" onsubmit="handleSaveItem(event)" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nome / Identificador *</label>
                <input required id="item-name" placeholder="Ex: Meta Quest 3 #01" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Modelo *</label>
                <input required id="item-model" placeholder="Ex: Quest 3 128GB, BoboVR M3, etc." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Número de Série (Serial Number) *</label>
                <input required id="item-sn" placeholder="Ex: 1WMHH8178C9021" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm font-mono text-cyan-300 focus:border-cyan-500 focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Tags / Categorias (separadas por vírgula)</label>
                <input id="item-tags" placeholder="Ex: VR, Meta, Headset, Bateria, Escritorio" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none" />
              </div>
            </div>

            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center gap-3">
              <input type="checkbox" id="item-is-headset" checked class="w-4 h-4 accent-cyan-500 rounded" />
              <label for="item-is-headset" class="text-sm font-medium text-slate-200 cursor-pointer">
                Este item é um Headset VR (Contabiliza na capacidade e disponibilidade geral)
              </label>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Estado de Conservação</label>
                <select id="item-condition" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none">
                  <option value="novo">Novo na Caixa</option>
                  <option value="excelente" selected>Excelente (Sem marcas)</option>
                  <option value="bom">Bom (Marcas leves de uso)</option>
                  <option value="avarias">Com Avarias (Funcional)</option>
                  <option value="manutencao">Em Manutenção</option>
                  <option value="aposentado">Aposentado / Baixa</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Status Atual</label>
                <select id="item-status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none">
                  <option value="disponivel" selected>Disponível</option>
                  <option value="em_evento">Em Evento</option>
                  <option value="manutencao">Manutenção</option>
                  <option value="reservado">Reservado</option>
                </select>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Observações e Histórico Inicial</label>
              <textarea id="item-notes" rows="2" placeholder="Observações de acessórios, número da nota fiscal, lentes especiais, etc." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:border-cyan-500 focus:outline-none"></textarea>
            </div>

            <button type="submit" class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/20">
              Salvar Item e Gerar QR Code
            </button>
          </form>
        </div>
      `;
    }

    function handleSaveItem(e) {
      e.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const model = document.getElementById('item-model').value.trim();
      const serialNumber = document.getElementById('item-sn').value.trim();
      const rawTags = document.getElementById('item-tags').value;
      const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
      const isHeadset = document.getElementById('item-is-headset').checked;
      const condition = document.getElementById('item-condition').value;
      const status = document.getElementById('item-status').value;
      const notes = document.getElementById('item-notes').value.trim();

      const newItem = {
        id: 'vr_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        name,
        model,
        serialNumber,
        tags: tags.length ? tags : ['VR'],
        category: tags[0] || (isHeadset ? 'Headset' : 'Acessórios'),
        isHeadset,
        condition,
        status,
        notes,
        maintenanceHistory: [],
        createdAt: new Date().toISOString(),
      };

      items.unshift(newItem);
      persist();

      if (db) {
        db.collection('vr_fleet_management_items').doc(newItem.id).set(newItem);
      }

      alert('Item cadastrado com sucesso!');
      switchTab('categories');
    }

    function renderCategories(container) {
      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-slate-900 border border-slate-800 rounded-2xl">
            <p class="text-lg text-slate-300 font-semibold">Nenhum item cadastrado no estoque ainda</p>
            <p class="text-sm text-slate-500 mt-1 mb-4">Cadastre seus Meta Quests, BoboVRs ou PCs para iniciar seu gerenciamento.</p>
            <button onclick="switchTab('register')" class="px-5 py-2.5 bg-cyan-500 text-slate-950 font-bold text-sm rounded-xl">
              + Cadastrar Primeiro Item
            </button>
          </div>
        `;
        return;
      }

      const cardsHtml = items.map(item => `
        <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex flex-col justify-between transition">
          <div>
            <div class="flex items-start justify-between gap-2">
              <span class="text-xs px-2 py-0.5 rounded font-mono font-medium ${item.isHeadset ? 'bg-cyan-500/20 text-cyan-300' : 'bg-slate-800 text-slate-300'}">
                ${item.isHeadset ? '🥽 Headset' : '📦 Equipamento'}
              </span>
              <span class="text-xs px-2 py-0.5 rounded font-medium ${item.status === 'disponivel' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
                ${item.status}
              </span>
            </div>
            <h4 class="text-base font-bold text-white mt-2">${item.name}</h4>
            <p class="text-xs text-slate-400 font-medium">${item.model}</p>
            <div class="mt-2 text-xs font-mono text-slate-500">S/N: ${item.serialNumber}</div>
            <div class="flex flex-wrap gap-1 mt-3">
              ${(item.tags || []).map(t => `<span class="text-[10px] px-2 py-0.5 bg-slate-800 text-slate-400 rounded-full">${t}</span>`).join('')}
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
            <button onclick="printItemQr('${item.id}')" class="text-xs text-cyan-400 hover:underline">Imprimir QR</button>
            <button onclick="deleteItem('${item.id}')" class="text-xs text-rose-400 hover:underline">Excluir</button>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-white">Estoque Atual (${items.length} itens)</h3>
            <button onclick="switchTab('register')" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold rounded-lg">
              + Novo Item
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function deleteItem(id) {
      if (confirm('Tem certeza que deseja excluir este item?')) {
        items = items.filter(i => i.id !== id);
        persist();
        if (db) {
          db.collection('vr_fleet_management_items').doc(id).delete();
        }
      }
    }

    function printItemQr(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = `
        <div style="padding: 20px; font-family: sans-serif; text-align: center; border: 2px dashed #000; max-width: 320px; margin: 20px auto;">
          <h2 style="margin: 0 0 5px 0; font-size: 16px;">${item.name}</h2>
          <p style="margin: 0 0 10px 0; font-size: 12px; color: #555;">${item.model}</p>
          <div id="qr-target" style="display: flex; justify-content: center; margin: 10px 0;"></div>
          <p style="margin: 5px 0 0 0; font-family: monospace; font-size: 11px;">S/N: ${item.serialNumber}</p>
          <p style="margin: 2px 0 0 0; font-size: 9px; color: #777;">VR Fleet Management System</p>
        </div>
      `;
      
      QRCode.toCanvas(JSON.stringify({ id: item.id, sn: item.serialNumber, name: item.name }), { width: 160 }, function (err, canvas) {
        if (!err && canvas) {
          document.getElementById('qr-target').appendChild(canvas);
          window.print();
        }
      });
    }

    function renderEvents(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold text-white">Eventos & Agendamentos</h3>
              <p class="text-xs text-slate-400">Ao alocar equipamentos a um evento, eles ficam indisponíveis na data escolhida.</p>
            </div>
            <button onclick="showCreateEventModal()" class="px-3 py-1.5 bg-cyan-500 text-slate-950 text-xs font-bold rounded-lg hover:bg-cyan-400">
              + Novo Evento
            </button>
          </div>

          ${events.length === 0 ? `
            <div class="text-center py-12 bg-slate-900 border border-slate-800 rounded-2xl">
              <p class="text-slate-400 text-sm">Nenhum evento registrado ainda.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${events.map(ev => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div class="flex items-center gap-2">
                      <h4 class="text-base font-bold text-white">${ev.title}</h4>
                      <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-medium">${ev.status}</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-1">Local/Cliente: ${ev.clientOrLocation || 'Não especificado'}</p>
                    <p class="text-xs font-mono text-cyan-400 mt-0.5">
                      📅 ${new Date(ev.startDate).toLocaleDateString('pt-BR')} até ${new Date(ev.endDate).toLocaleDateString('pt-BR')}
                    </p>
                    <p class="text-xs text-slate-500 mt-1">Equipamentos alocados: ${(ev.allocatedItemIds || []).length} itens</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="deleteEvent('${ev.id}')" class="px-3 py-1 bg-rose-500/20 text-rose-400 text-xs rounded hover:bg-rose-500/30">
                      Excluir
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function deleteEvent(id) {
      if (confirm('Excluir este evento? Os itens alocados serão liberados.')) {
        events = events.filter(e => e.id !== id);
        persist();
        if (db) {
          db.collection('vr_fleet_management_events').doc(id).delete();
        }
      }
    }

    function showCreateEventModal() {
      const title = prompt('Nome do Evento:');
      if (!title) return;
      const client = prompt('Cliente ou Local:');
      const startDate = prompt('Data de Início (AAAA-MM-DD):', new Date().toISOString().split('T')[0]);
      if (!startDate) return;
      const endDate = prompt('Data de Término (AAAA-MM-DD):', startDate);
      
      const newEv = {
        id: 'ev_' + Date.now(),
        title,
        clientOrLocation: client || '',
        startDate,
        endDate: endDate || startDate,
        status: 'agendado',
        allocatedItemIds: [],
        createdAt: new Date().toISOString()
      };

      events.push(newEv);
      persist();
      if (db) {
        db.collection('vr_fleet_management_events').doc(newEv.id).set(newEv);
      }
      renderCurrentView();
    }

    // Initialize
    initFirebaseIfPossible();
    renderCurrentView();
  </script>
</body>
</html>
